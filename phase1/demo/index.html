#toast{position:fixed;z-index:60;background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:6px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .15s}
#toast.on{opacity:1}
#holdRing{position:fixed;z-index:70;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;pointer-events:none;display:none;
  background:conic-gradient(var(--accent) calc(var(--p,0)*1turn),transparent 0);-webkit-mask:radial-gradient(circle,transparent 9px,#000 10px);mask:radial-gradient(circle,transparent 9px,#000 10px)}
#holdRing.on{display:block;animation:hold 1s linear forwards}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
@keyframes hold{to{--p:1}}
@media (prefers-reduced-motion:reduce){#holdRing.on{animation:none;--p:1}}

/* code entry */
.entry{max-width:340px;margin:0 auto;display:grid;gap:12px;text-align:left}
.entry label{font-weight:600}
.entry input{font-family:var(--f-mono);font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.entry .err{color:var(--danger);font-size:13px;min-height:1.2em}

/* participant app */
.wrap{height:100%;display:flex;flex-direction:column}
.app{flex:1;min-height:0;display:flex;gap:12px;padding:12px 16px}
.work{flex:1;min-width:0;display:grid;grid-template-rows:minmax(0,3fr) minmax(0,1fr);gap:12px}
.main{min-height:0;display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--rule)}
.bar .spacer{flex:1}
.tab{border-radius:16px;padding:3px 12px;background:transparent}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{font-size:11px;letter-spacing:.04em;padding:1px 6px;border-radius:10px;border:1px solid currentColor;margin-left:4px}
.tgl{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}
.tgl input{width:auto}
.startbar{display:flex;align-items:center;justify-content:center;padding:10px;background:var(--accent-soft);border-bottom:1px solid var(--rule)}
.resel{background:var(--accent);color:var(--accent-ink);padding:6px 12px;display:flex;gap:10px;align-items:center}
.resel button{background:transparent;color:inherit;border-color:currentColor}

.script-scroll{flex:1;min-height:0;overflow:auto;-webkit-user-select:none;user-select:none;background:var(--paper)}
.sheet{max-width:50em;margin:20px auto 40px;background:var(--sheet);border:1px solid var(--rule);padding:28px 32px 48px}
.scene-title{font-family:var(--f-script);font-weight:600;font-size:17px;margin:0 0 14px;padding-left:4.2em}
.ln{display:grid;grid-template-columns:3.6em minmax(0,1fr);column-gap:.6em;font-family:var(--f-script);font-size:16px;line-height:1.8}
.ln .no{font-family:var(--f-mono);font-size:11px;color:var(--faint);text-align:right;padding-top:.45em;display:flex;justify-content:flex-end;gap:4px;align-items:flex-start}
.ln .lt{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.ln .spk{font-weight:600;margin-right:.5em;font-family:var(--f-ui);font-size:14px}
.ln.dir .lt{font-style:italic;color:var(--muted)}
.ln.tline .spk{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.c{cursor:text}
.script-scroll .c{cursor:crosshair}
.bt{border-radius:2px;transition:background .12s}
.bt.b0{background:var(--h0)}.bt.b1{background:var(--h1)}.bt.b2{background:var(--h2)}.bt.b3{background:var(--h3)}.bt.b4{background:var(--h4)}.bt.b5{background:var(--h5)}
.bt.b0.hov,.bt.b0.flash{background:var(--s0)}.bt.b1.hov,.bt.b1.flash{background:var(--s1)}.bt.b2.hov,.bt.b2.flash{background:var(--s2)}.bt.b3.hov,.bt.b3.flash{background:var(--s3)}.bt.b4.hov,.bt.b4.flash{background:var(--s4)}.bt.b5.hov,.bt.b5.flash{background:var(--s5)}
.bchip{font-family:var(--f-mono);font-size:10px;line-height:1;padding:3px 5px;border-radius:9px;color:#fff;font-weight:500;cursor:default}
.k0{background:var(--d0)}.k1{background:var(--d1)}.k2{background:var(--d2)}.k3{background:var(--d3)}.k4{background:var(--d4)}.k5{background:var(--d5)}
:root .bchip{color:var(--sheet)}
.c.flag{box-shadow:inset 2px 0 0 var(--accent);background:var(--accent-soft)}
.flagtag{display:inline-block;font-family:var(--f-ui);font-size:10px;background:var(--accent);color:var(--accent-ink);padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:.3em}

.gap{position:relative;min-height:9px;margin-left:4.2em}
.gap-add{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;padding:0 8px;line-height:16px;border-radius:9px;opacity:0;background:var(--sheet);color:var(--muted);z-index:2}
.gap:hover .gap-add,.gap-add:focus-visible{opacity:1}
.gap.has{padding:4px 0}
.gap.has .gap-add{position:static;transform:none;opacity:.0;margin-top:2px}
.gap.has:hover .gap-add{opacity:1}
.note{border:1px solid var(--think-bd);background:var(--think-bg);border-radius:6px;padding:6px 8px;margin:4px 0;font-family:var(--f-ui);font-size:13px}
.note.past{border-color:var(--past-bd);background:var(--past-bg)}
.note-h{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.note-h .spacer{flex:1}
.note-h button{font-size:12px;padding:1px 8px;background:transparent}
.note-h .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note textarea{background:transparent;border-color:transparent;padding:2px 0;min-height:3.2em}
.note textarea:focus{background:var(--sheet);border-color:var(--rule)}
.note-prev{cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* beat strip */
.menu{min-height:0;display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.menu-h{padding:6px 12px;font-size:12px;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--rule);display:flex;gap:8px}
.menu-row{flex:1;min-height:0;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:10px 12px;align-items:stretch}
.empty{color:var(--faint);padding:12px;margin:0}
.bcard{flex:0 0 210px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);min-height:0;overflow:hidden}
.bcard.hov{border:2px solid var(--ink);padding:7px 9px}
.bcard.open{background:var(--accent-soft);border-color:var(--accent)}
.bcard .top{display:flex;gap:6px;align-items:center;width:100%}
.bcard .rng{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.bcard .pur{font-family:var(--f-script);font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bcard .pur.none{color:var(--faint);font-family:var(--f-ui)}
.bcard .st{font-size:11px;color:var(--muted);margin-top:auto}
.done-mark{color:var(--ok);font-weight:600}

/* beat detail */
.bd-scroll{flex:1;min-height:0;overflow:auto}
.bd-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--rule)}
.bd-head .title{font-weight:600;display:flex;gap:6px;align-items:center}
.bd-head .spacer{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 0}
.chip{font-size:12px;border:1px solid var(--accent);color:var(--accent);border-radius:12px;padding:1px 8px;background:transparent}
.bd-purpose{padding:12px 16px 4px;display:grid;gap:4px}
.bd-purpose label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.bd-purpose input{font-family:var(--f-script);font-size:17px}
.bd{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,300px);gap:20px;padding:8px 16px 24px}
.bd-text{font-family:var(--f-script);font-size:19px;line-height:2.1;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.bd-line{display:block;margin-bottom:.3em}
.bd-line .spk{font-family:var(--f-ui);font-weight:600;font-size:14px;margin-right:.5em}
.bd-line.dir{font-style:italic;color:var(--muted)}
.sen{border-radius:3px;transition:background .12s}
.sen.g0{background:var(--h0)}.sen.g1{background:var(--h1)}.sen.g2{background:var(--h2)}.sen.g3{background:var(--h3)}.sen.g4{background:var(--h4)}.sen.g5{background:var(--h5)}
.sen.g0.hov{background:var(--s0)}.sen.g1.hov{background:var(--s1)}.sen.g2.hov{background:var(--s2)}.sen.g3.hov{background:var(--s3)}.sen.g4.hov{background:var(--s4)}.sen.g5.hov{background:var(--s5)}
.glab{font-family:var(--f-mono);font-size:10px;padding:1px 4px;border-radius:3px;color:var(--sheet);vertical-align:.5em;margin-right:2px;-webkit-user-select:none;user-select:none}
.mu{text-decoration:underline;text-decoration-color:var(--think-bd);text-decoration-thickness:2px;text-underline-offset:4px}
.mu.mm{text-decoration-style:double}
.mu.hov{background:var(--think-bg)}
.selx{background:var(--accent-soft);outline:1px solid var(--accent)}
.margin{display:grid;gap:14px;align-content:start}
.margin h3{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;font-weight:600}
.mcard{border:1px solid var(--rule);border-radius:6px;padding:8px;background:var(--paper);display:grid;gap:6px}
.mcard.hov{border-color:var(--ink)}
.mcard .row{display:flex;align-items:center;gap:6px}
.mcard .row .spacer{flex:1}
.mcard .q{font-family:var(--f-script);font-size:13px;color:var(--muted);border-left:2px solid var(--think-bd);padding-left:6px;max-height:4.5em;overflow:hidden}
.mcard .gname{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:3px;color:var(--sheet)}
.oor{font-size:11px;color:var(--warn)}
.mcard button{font-size:12px;padding:1px 8px}
#fmenu{position:fixed;z-index:65;background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);border-radius:8px;padding:4px;display:flex;gap:4px}
#fmenu[hidden]{display:none}
#fmenu button{border-color:transparent}
#fmenu button:hover{background:var(--accent-soft)}

/* completion board */
.board-scroll{flex:1;min-height:0;overflow:auto;background:var(--paper)}
.board{max-width:60em;margin:20px auto 40px;background:var(--sheet);border:1px solid var(--rule);padding:28px 36px 40px;display:grid;gap:30px}
.board .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.board h2{font-family:var(--f-script);font-weight:600;font-size:26px;margin:4px 0 6px;text-wrap:balance}
.board .stats{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.board h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.board .lab{font-size:11px;letter-spacing:.06em;color:var(--muted);margin:10px 0 4px}
.bfields{display:grid;gap:14px}
.bfields label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.bfields textarea{font-family:var(--f-script);font-size:16px;line-height:1.6;color:var(--ink)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.fl-beat{display:flex;flex-direction:column;gap:4px;text-align:left;width:190px;background:var(--paper);padding:8px 10px}
.fl-beat .top{display:flex;gap:6px;align-items:center}
.fl-v{font-weight:600;font-size:14px}
.fl-p{font-family:var(--f-script);font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fl-arrow{align-self:center;color:var(--faint);font-size:16px}
.missing{color:var(--warn);font-size:12px}
.brow{display:grid;grid-template-columns:7em minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--rule)}
.brow:first-of-type{border-top:0;padding-top:4px}
.brow .left{display:grid;gap:6px;align-content:start}
.brow .left button{font-size:12px;padding:2px 8px;justify-self:start}
.brow .purpose{font-family:var(--f-script);font-size:18px;margin:0}
.brow ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.brow q{font-family:var(--f-script);color:var(--muted)}
.ncols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.nitem{display:block;width:100%;text-align:left;margin-bottom:6px;border:1px solid var(--think-bd);background:var(--think-bg);padding:6px 10px;font-size:14px;white-space:pre-wrap}
.nitem.past{border-color:var(--past-bd);background:var(--past-bg)}
.nitem .pos{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:block}
.refl{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.refl a{color:var(--accent);font-size:12px}
.hint-s{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.tl-list{display:grid;gap:4px}
.tl-scene{font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 2px}
.tl-scene:first-child{margin-top:0}
.tl-row{display:grid;grid-template-columns:auto 6.5em 6.5em minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px 8px;border:1px solid var(--rule);border-left-width:4px;border-radius:4px;background:var(--paper);font-size:14px;cursor:pointer}
.tl-row input{margin-top:3px}
.tl-row.on{background:var(--accent-soft);border-color:var(--accent)}
.tl-row.k-past{border-left-color:var(--past-bd)}.tl-row.k-think{border-left-color:var(--think-bd)}.tl-row.k-verb{border-left-color:var(--accent)}.tl-row.k-memo{border-left-color:var(--warn)}.tl-row.k-purpose{border-left-color:var(--ok)}
.tl-pos{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:2px}
.tl-kind{font-size:12px;color:var(--muted);padding-top:1px}
.tl-body q{font-family:var(--f-script);color:var(--muted)}
.tl-body b{font-weight:600}
.tl-row button{font-size:12px;padding:0 8px}
.pickbar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;justify-content:flex-end;background:var(--sheet);border-top:1px solid var(--rule);padding:8px 0;margin-top:8px;z-index:2}
.pickbar .muted{margin-right:auto;font-size:13px}
.bu-list{display:grid;gap:10px}
.bundle{border:1px solid var(--rule);border-radius:6px;padding:10px 12px;display:grid;gap:8px;background:var(--paper)}
.bu-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.buchip{font-family:var(--f-mono);font-size:11px;background:var(--ink);color:var(--sheet);border-radius:9px;padding:2px 7px}
.bu-items{margin:0;padding-left:20px;display:grid;gap:3px;font-size:13px}
.bu-items q{font-family:var(--f-script);color:var(--muted)}
.bu-note{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.bu-note textarea{font-family:var(--f-script);font-size:15px;color:var(--ink)}
.bu-st{font-size:12px;color:var(--muted)}
button.bu-st{color:var(--accent)}
@media (max-width:960px){.board{padding:20px 16px}.brow,.ncols{grid-template-columns:minmax(0,1fr)}.tl-row{grid-template-columns:auto minmax(0,1fr)}.tl-row>*:not(input){grid-column:2}}

/* AI drawer */
.side{width:44px;flex:0 0 auto;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.side.open{width:clamp(320px,20vw,440px)}
.side-tab{flex:1;border:0;border-radius:0;background:transparent;writing-mode:vertical-rl;font-weight:600;letter-spacing:.2em;position:relative;color:var(--muted)}
.side-tab:hover{color:var(--ink);background:var(--accent-soft)}
.dot{position:absolute;top:12px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--accent)}
.side-h{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule)}
.side-h b{flex:1}
.disclose{margin:0;padding:6px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--rule)}
.tools{display:grid;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.tools .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.refwrap{position:relative}
.refwrap button{width:100%}
.reflist{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--sheet);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow);padding:4px;z-index:5;display:grid;gap:2px}
.reflist button{text-align:left;border-color:transparent}
.reflist button:hover{background:var(--accent-soft)}
.hint{font-size:12px;color:var(--muted)}
.ask{display:grid;gap:6px}
.ask .row{display:flex;justify-content:flex-end}
.thread{flex:1;min-height:0;overflow:auto;padding:10px 12px;display:grid;gap:12px;align-content:start}
.req{font-size:13px;display:grid;gap:6px}
.req-q{justify-self:end;max-width:90%;background:var(--accent-soft);border-radius:10px 10px 2px 10px;padding:6px 10px}
.req-q .lab{font-size:11px;color:var(--muted);display:block}
.waiting{color:var(--muted);font-size:13px}
.rcard{border:1px solid var(--rule);border-radius:8px;padding:10px;display:grid;gap:6px;background:var(--paper)}
.rcard .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.rcard .meta .pill{border:1px solid var(--rule);border-radius:10px;padding:0 6px}
.rcard h4{margin:0;font-size:14px;font-family:var(--f-script);font-weight:600}
.rcard p{margin:0;font-size:13px}
.rcard blockquote{margin:0;padding-left:8px;border-left:2px solid var(--rule);font-family:var(--f-script);font-size:13px;color:var(--muted)}
.rcard a{color:var(--accent);font-size:12px}
.decide{display:flex;gap:4px;flex-wrap:wrap}
.decide button{font-size:12px;padding:2px 8px}
.decide button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.done-over{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--paper) 88%,transparent);display:grid;place-items:center;padding:16px}
.done-over .box{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:28px 32px;text-align:center;box-shadow:var(--shadow)}
.done-over h1{font-family:var(--f-script);margin:0 0 12px;font-size:24px}

/* wizard */
.wz{height:100%;display:grid;grid-template-columns:230px minmax(0,1fr) minmax(340px,420px);grid-template-rows:auto minmax(0,1fr);gap:12px;padding:12px 16px}
.wz-h{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wz-h h1{font-size:15px;margin:0;font-weight:600}
.wz-h h1 span{font-weight:400;color:var(--muted)}
.wz-h .spacer{flex:1}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.panel-h{padding:8px 12px;border-bottom:1px solid var(--rule);font-size:12px;letter-spacing:.06em;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-b{flex:1;min-height:0;overflow:auto;padding:10px 12px}
.runbtn{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;margin-bottom:6px;padding:8px}
.runbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.runbtn .code{font-family:var(--f-mono);font-weight:500;font-size:15px}
.runbtn .ago{grid-column:1/-1;font-size:11px;color:var(--muted)}
.badge{background:var(--danger);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;font-family:var(--f-mono)}
.phase{font-size:11px;border-radius:10px;padding:0 7px;border:1px solid var(--rule);color:var(--muted)}
.phase.task{border-color:var(--accent);color:var(--accent)}
.phase.done{border-color:var(--ok);color:var(--ok)}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kv div{background:var(--paper);border-radius:6px;padding:6px 8px}
.kv dt{font-size:11px;color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.sec{margin:14px 0 6px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.mbeat{border:1px solid var(--rule);border-radius:6px;padding:8px 10px;margin-bottom:8px;background:var(--paper)}
.mbeat.fresh,.mnote.fresh{outline:2px solid var(--warn)}
.mbeat .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}

.mnote{font-size:13px;border-left:3px solid var(--think-bd);padding:4px 8px;margin-bottom:6px;background:var(--paper)}
.mnote.past{border-left-color:var(--past-bd)}
.evlist{font-size:12px;font-family:var(--f-mono);display:grid;gap:2px}
.evlist div{display:grid;grid-template-columns:4.5em 1fr;gap:8px}
.markers{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.markers input{flex:1;min-width:140px;width:auto}
.queue-item{width:100%;text-align:left;display:grid;gap:2px;margin-bottom:6px;padding:8px}
.queue-item.on{border-color:var(--accent);background:var(--accent-soft)}
.queue-item.answered{opacity:.6}
.queue-item .t{display:flex;gap:6px;align-items:center;font-size:12px}
.queue-item .t .spacer{flex:1}
.wait{font-family:var(--f-mono);color:var(--danger)}
.snap{background:var(--paper);border-radius:6px;padding:8px;font-size:13px;margin-bottom:8px}
.snap .p{font-family:var(--f-script)}
.branches{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.branches button{font-size:12px;padding:1px 8px}
.branches button.top{border-color:var(--accent);color:var(--accent);font-weight:600}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.filters input{grid-column:1/-1}
.pcard{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;border:1px solid var(--rule);border-radius:6px;padding:8px;margin-bottom:6px;cursor:pointer;background:var(--paper)}
.pcard.on{border-color:var(--accent);background:var(--accent-soft)}
.pcard input{margin-top:3px}
.pcard .meta{font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.pcard h4{margin:0;font-size:13px}
.pcard p{margin:0;font-size:12px;color:var(--muted)}
.sendbar{border-top:1px solid var(--rule);padding:8px 12px;display:grid;gap:6px}
.tl{display:grid;gap:0;font-size:13px}
.tl-item{display:grid;grid-template-columns:5.5em 7em minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px solid var(--rule)}
.tl-item .el{font-family:var(--f-mono);color:var(--muted)}
.tl-item .cat{font-size:11px}
.tl-item.ai{background:var(--accent-soft)}
.tl-item.mk{background:var(--think-bg)}
.tl-item.mode{font-weight:600}
.tl-item .d{overflow-wrap:anywhere;color:var(--muted);font-size:12px}
.tl-item .lbl{color:var(--ink);font-size:13px}
.chipsf{display:flex;gap:4px;flex-wrap:wrap}
.chipsf button{font-size:12px;padding:1px 8px;border-radius:12px}
.chipsf button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (max-width:960px){
  .app{flex-direction:column;height:auto}
  .wrap{height:auto}
  .work{grid-template-rows:70vh 220px}
  .side,.side.open{width:auto;min-height:44px}
  .side-tab{writing-mode:horizontal-tb;padding:10px}
  .bd{grid-template-columns:minmax(0,1fr)}
  .wz{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .wz .panel{max-height:70vh}
  .sheet{padding:20px 14px}
}

/* ---------- boot ---------- */
async function boot() {

  const me = await user.me().catch(() => null);
  uid = me && me.id;
  if (!uid) { centerMsg('Act & Connect', '초대받은 계정으로 로그인한 뒤 다시 열어 주세요'); return; }

    db.doc('config/' + k).onSnapshot(s => {
      if (k === 'settings') cfg.settings = s.exists ? { showPolarity: false, ...s.data() } : { showPolarity: false };

const P = {

function curKind() { return P.run && P.run.taskStartAt ? 'task' : 'practice'; }

  $$('[data-since]').forEach(el => { el.textContent = fmtDur(now() - +el.dataset.since); });

  if (MODE === 'wizard' && Z.fresh.size && Z.tab === 'live') { let stale = false; for (const [k, t] of Z.fresh) if (now() - t > 4000) { Z.fresh.delete(k); stale = true; } if (stale) renderLive(); }
}, 1000);

boot();
})();

</script>
