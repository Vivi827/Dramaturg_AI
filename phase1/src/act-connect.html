<title>Act &amp; Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
/* Phase 1 v5 — SPEC.md v2.1. Screen 1: Character Journey | Beats | Scripts. Screen 2: Beats | Connections | Dramaturgy Agent. */
:root{
  --paper:#eef0ee; --sheet:#fbfbfa; --ink:#1e2226; --muted:#5f666d; --faint:#959ca3; --rule:#d7dad7;
  --accent:#2b5a83; --accent-ink:#ffffff; --accent-soft:#dbe6f0;
  --ok:#2c7a4c; --warn:#a85418; --danger:#ad2a22;
  --c0:#2b5a83; --c1:#2c7a4c; --c2:#c0571b; --c3:#7d5fb0; --c4:#187c88; --c5:#aa3a62; --c6:#8a6d12; --c7:#4f5b66; --cx:#959ca3;
  --shadow:0 6px 24px rgba(20,30,40,.14);
  --f-script:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15181b; --sheet:#1d2125; --ink:#e6e8ea; --muted:#a5adb5; --faint:#78808a; --rule:#323840;
  --accent:#7fb0dc; --accent-ink:#0f1a24; --accent-soft:#233548;
  --ok:#6cc392; --warn:#e3965c; --danger:#ef7d74;
  --c0:#7fb0dc; --c1:#6cc392; --c2:#e9935a; --c3:#ad92dc; --c4:#60c4ce; --c5:#e878a0; --c6:#d6b54a; --c7:#9aa6b2; --cx:#78808a;
  --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15181b; --sheet:#1d2125; --ink:#e6e8ea; --muted:#a5adb5; --faint:#78808a; --rule:#323840;
  --accent:#7fb0dc; --accent-ink:#0f1a24; --accent-soft:#233548;
  --ok:#6cc392; --warn:#e3965c; --danger:#ef7d74;
  --c0:#7fb0dc; --c1:#6cc392; --c2:#e9935a; --c3:#ad92dc; --c4:#60c4ce; --c5:#e878a0; --c6:#d6b54a; --c7:#9aa6b2; --cx:#78808a;
  --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:5px 10px}
button:hover{border-color:var(--muted)}
button:disabled{cursor:not-allowed;opacity:.5}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);border-color:var(--rule)}
button.danger{color:var(--danger)}
button.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
button.sm{font-size:12px;padding:1px 8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],textarea,select{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;width:100%}
textarea{resize:vertical}
#root{height:100%}
.center{height:100%;display:grid;place-items:center;padding:24px 16px;text-align:center}
.center h1{font-family:var(--f-script);font-weight:600;font-size:22px;margin:0 0 6px}
.center p{color:var(--muted);margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.empty{color:var(--faint);padding:12px;margin:0;font-size:13px}
.banner{padding:8px 16px;font-weight:500;text-align:center}
.banner.danger{background:var(--danger);color:#fff}
.narrow-note{display:none;padding:8px 16px;background:var(--accent-soft);color:var(--ink);font-size:13px}
@media (max-width:1100px){.narrow-note{display:block}}
#toast{position:fixed;z-index:90;background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:6px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .15s}
#toast.on{opacity:1}
.k0{--hc:var(--c0)}.k1{--hc:var(--c1)}.k2{--hc:var(--c2)}.k3{--hc:var(--c3)}.k4{--hc:var(--c4)}.k5{--hc:var(--c5)}.k6{--hc:var(--c6)}.k7{--hc:var(--c7)}.kx{--hc:var(--cx)}

/* code entry */
.entry{max-width:340px;margin:0 auto;display:grid;gap:12px;text-align:left}
.entry label{font-weight:600}
.entry input{font-family:var(--f-mono);font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.entry .err{color:var(--danger);font-size:13px;min-height:1.2em}

/* participant shell */
.wrap{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.top .spacer{flex:1}
.top .title{font-family:var(--f-script);font-weight:600}
.stabs{display:inline-flex}
.stabs button{border-radius:0;margin-left:-1px;position:relative;padding:5px 14px}
.stabs button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.stabs button:last-child{border-radius:0 6px 6px 0}
.stabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stabs .dot{position:absolute;top:3px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.startbar{display:flex;align-items:center;justify-content:center;padding:10px;background:var(--accent-soft);border-bottom:1px solid var(--rule)}
.stage{flex:1;min-height:0;display:grid;gap:12px;padding:12px 16px}
.stage.collect{grid-template-columns:minmax(200px,20%) minmax(260px,25%) minmax(0,1fr)}
.stage.connect{grid-template-columns:minmax(240px,22%) minmax(0,1fr) minmax(300px,25%)}
.pane{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.pane-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule);min-height:42px}
.pane-h h2{font-size:13px;margin:0;font-weight:600;letter-spacing:.02em}
.pane-h .spacer{flex:1}
.pane-h .sub{font-family:var(--f-script);font-size:14px;color:var(--muted)}
.pane-b{flex:1;min-height:0;overflow:auto}
.tgl{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}
.tgl input{width:auto}

/* Character Journey */
.jlist{list-style:none;margin:0;padding:8px}
.jrow{width:100%;text-align:left;display:grid;gap:4px;padding:8px 10px;margin-bottom:6px;background:var(--paper);border:1px solid var(--rule);border-radius:6px}
.jrow.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.jrow.absent .jt{color:var(--muted)}
.jrow .jt{font-family:var(--f-script);font-size:14px;line-height:1.35}
.jrow .jm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.jrow .tag{font-size:10px;letter-spacing:.04em;padding:0 6px;border-radius:9px;border:1px solid currentColor}
.jdots{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.jb{font-family:var(--f-mono);font-size:10px;font-weight:600;line-height:16px;padding:0 4px;border-radius:3px;border:1px solid var(--hc);color:var(--hc)}
.jb.done{background:var(--hc);color:var(--sheet)}

/* Beats pane */
.bwrap{padding:8px 10px 24px;display:grid;gap:8px;align-content:start}
.bsec{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin:6px 2px 0}
.bsec .spacer{flex:1}
.bchip{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;line-height:17px;padding:0 5px;border-radius:4px;background:var(--hc);color:var(--sheet);user-select:none;-webkit-user-select:none;white-space:nowrap}
.bt{border:1px solid var(--rule);border-left:4px solid var(--hc);border-radius:6px;background:var(--paper);padding:6px 8px;display:grid;gap:4px;cursor:pointer}
.bt:hover,.bt.hov{border-color:var(--muted);border-left-color:var(--hc)}
.bt.open{background:var(--sheet);border-color:var(--ink);border-left-color:var(--hc);cursor:default}
.bt.open .bt-h{cursor:pointer}
.bt.flash{box-shadow:0 0 0 2px var(--accent)}
.bt-h{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.bt-h .spacer{flex:1}
.bt .ok,.node .ok{font-family:var(--f-ui);font-size:11px;color:var(--ok);font-weight:600}
.oncv{font-family:var(--f-ui);font-size:10px;border:1px solid var(--muted);border-radius:8px;padding:0 5px}
.bt .q{font-family:var(--f-script);font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bt .q.full{display:block;-webkit-line-clamp:unset;font-size:13px;color:var(--muted)}
.bt .pp{font-size:12px;font-weight:500}
.bt .vs{display:flex;gap:4px;flex-wrap:wrap}
.bt .vs span{font-size:11px;border:1px solid var(--hc);color:var(--ink);border-radius:9px;padding:0 6px}
.bt-ed{display:grid;gap:8px;padding-top:6px;border-top:1px dashed var(--rule)}
.bt-ed label{display:grid;gap:2px;font-size:11px;color:var(--muted)}
.bt-ed label input{font-family:var(--f-script);font-size:14px;color:var(--ink)}
.bt-ed .sub{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin-top:2px}
.bt-ed .row,.vg .row,.vm .row{display:flex;gap:6px;align-items:center}
.bt-ed .row .spacer,.vg .row .spacer,.vm .row .spacer{flex:1}
.vg,.vm{border:1px solid var(--rule);border-radius:6px;padding:6px 8px;display:grid;gap:4px;background:var(--paper)}
.vg .q,.vm .q{display:block;-webkit-line-clamp:unset;font-size:13px}
.vg input{font-family:var(--f-script);font-size:14px}
.vm textarea{font-size:13px}
.gname{font-size:11px;font-weight:600;color:var(--hc)}
.oor{font-size:11px;color:var(--warn)}
.cat-ph{color:var(--faint);font-size:13px;padding:6px 4px;line-height:1.6;margin:0}

/* Scripts */
.script-scroll{background:var(--paper)}
.sheet{max-width:48em;margin:16px auto 40px;background:var(--sheet);border:1px solid var(--rule);padding:24px 28px 44px}
.scene-title{font-family:var(--f-script);font-weight:600;font-size:17px;margin:0 0 14px;padding-left:4.2em}
.ln{display:grid;grid-template-columns:3.6em minmax(0,1fr);column-gap:.6em;font-family:var(--f-script);font-size:16px;line-height:1.85}
.ln .no{font-family:var(--f-mono);font-size:11px;color:var(--faint);text-align:right;padding-top:.45em;user-select:none;-webkit-user-select:none}
.ln .lt{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.ln .spk{font-weight:600;margin-right:.5em;font-family:var(--f-ui);font-size:14px;user-select:none;-webkit-user-select:none}
.ln.dir .lt{font-style:italic;color:var(--muted)}
.ln.tline .spk{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.c{cursor:text}
/* beat / verb / memo marks: one wrapper span per run, so highlights are continuous */
.bk{background:color-mix(in srgb,var(--hc) 13%,transparent);cursor:pointer;transition:background .12s}
.bk.vb{background:color-mix(in srgb,var(--hc) 24%,transparent);box-shadow:inset 0 -2px 0 var(--hc)}
.bk.mu{text-decoration:underline dotted var(--warn) 2px;text-underline-offset:6px}
.bk.hov,.bk.flash{background:color-mix(in srgb,var(--hc) 38%,transparent)}
.bk.resel{opacity:.45}
.bchip.inl{margin-right:4px;vertical-align:1px;font-size:10px;line-height:15px}
.glab{font-family:var(--f-ui);font-style:normal;font-size:10px;line-height:14px;color:var(--hc);border:1px solid var(--hc);border-radius:3px;padding:0 3px;margin-right:3px;vertical-align:2px;user-select:none;-webkit-user-select:none}
.selx{background:color-mix(in srgb,var(--accent) 32%,transparent)}
.resel-bar{display:flex;gap:8px;align-items:center;padding:6px 12px;background:var(--accent-soft);font-size:13px;border-bottom:1px solid var(--rule)}
#fmenu{position:fixed;z-index:85;background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);border-radius:8px;padding:4px;display:flex;gap:4px;flex-wrap:wrap;max-width:320px}
#fmenu[hidden]{display:none}
#fmenu button{border-color:transparent;display:inline-flex;align-items:center;gap:6px}
#fmenu button:hover{background:var(--accent-soft)}
#fmenu .lab{width:100%;font-size:11px;color:var(--muted);padding:2px 6px}
#fmenu form{display:flex;gap:4px;width:100%}
#fmenu form input{font-size:13px;padding:3px 6px}

/* Backstory panel */
.bs{max-width:44em;margin:16px auto 40px;background:var(--sheet);border:1px solid var(--rule);padding:22px 26px 30px;display:grid;gap:14px}
.bs h3{font-family:var(--f-script);font-weight:600;font-size:17px;margin:0}
.bs .help{font-size:13px;color:var(--muted);margin:-8px 0 0}
.bs-form{display:grid;gap:8px;border:1px dashed var(--rule);border-radius:8px;padding:10px}
.bs-form .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bs-form .row select{width:auto}
.bs-form .row input{width:5em}
.bs-item{border-left:3px solid var(--hc);background:var(--paper);border-radius:4px;padding:8px 10px;display:grid;gap:6px}
.bs-item textarea{font-family:var(--f-script);font-size:15px;background:transparent}
.bs-item .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}

/* Connections canvas */
.cv{position:relative;flex:1;min-height:0;overflow:auto;background:
  radial-gradient(circle,var(--rule) 1px,transparent 1.4px) 0 0/22px 22px,var(--paper);cursor:grab}
.cv.panning{cursor:grabbing}
.cv.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.cv-in{position:relative}
.cv svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.cv svg path.ln-v{fill:none;stroke:var(--muted);stroke-width:1.6}
.cv svg path.ln-hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
.cv svg path.ln-v.sel{stroke:var(--accent);stroke-width:2.6}
.cv svg path.ln-tmp{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.node{position:absolute;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:default}
.node .nh{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--rule);cursor:move;font-size:12px;user-select:none;-webkit-user-select:none}
.node .nh .spacer{flex:1}
.node .nh button{font-size:11px;padding:0 6px;line-height:18px}
.mnode{width:220px}
.mnode .nb{padding:6px 10px 8px;display:grid;gap:3px}
.mnode .pp{font-size:12px;font-weight:600}
.mnode .vl{margin:0;padding-left:16px;font-size:12px;color:var(--muted)}
.mnode .q{font-family:var(--f-script);font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mnode.hov{border-color:var(--ink)}
.port{position:absolute;right:-8px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--sheet);border:2px solid var(--hc,var(--muted));cursor:crosshair}
.port:hover{background:var(--hc,var(--muted))}
.inode{width:300px;border:1.5px solid var(--ink)}
.inode.sel{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 4px var(--accent)}
.inode.target{outline:2px dashed var(--accent);outline-offset:3px}
.inode .nb{padding:8px 10px 10px;display:grid;gap:6px}
.inode label{font-size:11px;color:var(--muted);display:grid;gap:2px}
.inode input{font-family:var(--f-script);font-weight:600;font-size:15px;padding:4px 6px}
.inode textarea{font-family:var(--f-script);font-size:14px;line-height:1.5;padding:4px 6px;min-height:5.2em}
.inode .inport{position:absolute;left:-7px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--ink)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:2px 8px;text-align:left}
.chip:hover{border-color:var(--accent)}
.cv-empty{position:absolute;left:24px;top:20px;color:var(--faint);font-size:13px;pointer-events:none;max-width:28em;line-height:1.6}
.lnx{position:absolute;transform:translate(-50%,-50%);font-size:11px;padding:0 6px;line-height:18px;border-radius:9px;z-index:3}

/* Dramaturgy Agent */
.disclose{margin:0;padding:6px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--rule);background:var(--paper)}
.ag-tools{display:grid;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.ag-tools .lab{font-size:11px;color:var(--muted)}
.ag-tools .tgt{font-family:var(--f-script);font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.chipsf{display:flex;gap:4px;flex-wrap:wrap}
.chipsf button{font-size:12px;padding:1px 8px;border-radius:12px}
.chipsf button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.thread{flex:1;min-height:0;overflow:auto;padding:10px 12px;display:grid;gap:14px;align-content:start}
.req{display:grid;gap:6px}
.req-h{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.req-h b{color:var(--ink);font-weight:600}
.req-intro{font-size:13px;margin:0}
.waiting{color:var(--muted);font-size:13px}
.rcard{border:1px solid var(--rule);border-radius:8px;padding:10px;display:grid;gap:6px;background:var(--paper)}
.rcard.flash{outline:2px solid var(--accent)}
.rcard .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.rcard .meta .pill{border:1px solid var(--rule);border-radius:10px;padding:0 6px}
.rcard h4{margin:0;font-size:14px;font-family:var(--f-script);font-weight:600}
.rcard p{margin:0;font-size:13px}
.rcard blockquote{margin:0;padding-left:8px;border-left:2px solid var(--rule);font-family:var(--f-script);font-size:13px;color:var(--muted)}
.rcard a{color:var(--accent);font-size:12px}
.decide{display:flex;gap:4px;flex-wrap:wrap}
.decide button{font-size:12px;padding:2px 8px}
.decide button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.done-over{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--paper) 88%,transparent);display:grid;place-items:center;padding:16px}
.done-over .box{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:28px 32px;text-align:center;box-shadow:var(--shadow)}
.done-over h1{font-family:var(--f-script);margin:0 0 12px;font-size:24px}

/* wizard */
.wz{height:100%;display:grid;grid-template-columns:230px minmax(0,1fr) minmax(340px,420px);grid-template-rows:auto minmax(0,1fr);gap:12px;padding:12px 16px}
.wz-h{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wz-h h1{font-size:15px;margin:0;font-weight:600}
.wz-h h1 span{font-weight:400;color:var(--muted)}
.wz-h .spacer{flex:1}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.panel-h{padding:8px 12px;border-bottom:1px solid var(--rule);font-size:12px;letter-spacing:.06em;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-b{flex:1;min-height:0;overflow:auto;padding:10px 12px}
.runbtn{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;margin-bottom:6px;padding:8px}
.runbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.runbtn .code{font-family:var(--f-mono);font-weight:500;font-size:15px}
.runbtn .ago{grid-column:1/-1;font-size:11px;color:var(--muted)}
.badge{background:var(--danger);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;font-family:var(--f-mono)}
.phase{font-size:11px;border-radius:10px;padding:0 7px;border:1px solid var(--rule);color:var(--muted)}

<script>
(() => {
'use strict';

/* ---------- toast & helpers ---------- */
let toastTimer = null, lastMouse = { x: 0, y: 0 };

function armConfirm(btn, label = '정말 삭제') { if (btn.dataset.armed === '1') return true; btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = label; btn.classList.add('armed'); setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = old; btn.classList.remove('armed'); } }, 3000); return false; }

/* ---------- serialized writes: one in flight per document ---------- */
const DEL = { del: true };
const W = new Map();
let writeErrorShown = false;
function write(ref, data, how = 'set') {

  if (!w) { w = { ref, q: [], running: false }; W.set(k, w); }

    const { data, how } = w.q.shift();
    try {
      if (data === DEL) await w.ref.delete();
      else if (how === 'update') await w.ref.update(data);
      else await w.ref.set(data);

}

  const msg = code === 'quota_exceeded' ? '저장 공간이 가득 찼습니다. 연구자에게 알려 주세요' : '저장 권한이 없습니다. 연구자에게 알려 주세요';
  const b = document.createElement('div'); b.className = 'banner danger'; b.textContent = msg; b.id = 'writeBanner';
  const wrap = $('.wrap') || root; wrap.prepend(b);
}
const strip = o => { const { id, ...r } = o; return r; };

/* ---------- boot ---------- */
async function boot() {
  if (!window.claude || typeof window.claude.use !== 'function') { centerMsg('Act & Connect', '초대받은 계정으로 로그인한 뒤 다시 열어 주세요'); return; }
  try { [user, db] = await Promise.all([claude.use('user'), claude.use('db')]); } catch (e) { user = null; db = null; }
  if (!user || !db) { centerMsg('Act & Connect', '초대받은 계정으로 로그인한 뒤 다시 열어 주세요'); return; }
  downloads = await claude.use('downloads').catch(() => null);
  isOwner = await user.isOwner().catch(() => false);
  const me = await user.me().catch(() => null);
  uid = me && me.id;
  if (!uid) { centerMsg('Act & Connect', '초대받은 계정으로 로그인한 뒤 다시 열어 주세요'); return; }

    db.doc('config/' + k).onSnapshot(s => {
      if (k === 'settings') cfg.settings = s.exists ? { showPolarity: false, ...s.data() } : { showPolarity: false };
      else cfg[k] = s.exists ? s.data() : null;
      cfgListeners.forEach(fn => fn(k));
    }, () => {});
  });
  await new Promise(r => setTimeout(r, 400));
  if (isOwner) startWizard(); else startParticipant();
}

/* ---------- shared script & beat helpers (participant + wizard) ---------- */
function scriptFor(kind) { return kind === 'task' ? cfg.script : cfg.practice; }
function sceneIn(sc, id) { return sc && (sc.scenes || []).find(s => s.id === id); }
function sceneIdx(sc, id) { if (id === BACKSTORY || !id) return -1; return sc ? sc.scenes.findIndex(s => s.id === id) : 0; }
function sceneShortIn(sc, id) { if (id === BACKSTORY) return 'Backstory'; const s = sceneIn(sc, id); return s ? (s.title || '').split('·')[0].trim() : ''; }
function targetAppears(sc, scene) { const t = sc && sc.targetCharacter; return !t || scene.lines.some(l => l.kind !== 'direction' && l.speaker === t); }
function quoteIn(sc, sceneId, range) {
  const scene = sceneIn(sc, sceneId); if (!scene || !range) return '';
  const parts = [];
  for (const l of scene.lines) {
    if (l.n < range.start.line || l.n > range.end.line) continue;
    const t = l.text || ''; const f = l.n === range.start.line ? range.start.offset : 0; const to = l.n === range.end.line ? range.end.offset : t.length - 1;
    parts.push(t.slice(f, to + 1));
  }
  return parts.join(' ');
}
const isBS = b => b.source === 'backstory';
function sortBeatsIn(sc, list) {
  return [...list].sort((a, b) => {
    if (isBS(a) !== isBS(b)) return isBS(a) ? -1 : 1;
    if (isBS(a)) return a.createdAt - b.createdAt;
    return (sceneIdx(sc, a.sceneId) - sceneIdx(sc, b.sceneId)) || posCmp(a.range.start, b.range.start) || a.createdAt - b.createdAt;
  });
}
function numMapIn(sc, list) { const m = new Map(); sortBeatsIn(sc, list.filter(b => !isBS(b))).forEach((b, i) => m.set(b.id, i + 1)); return m; }
function labelIn(b, nm) { return isBS(b) ? 'Backstory' : 'B' + (nm.get(b.id) || '?'); }
function classIn(b, nm) { return isBS(b) ? 'kx' : 'k' + (((nm.get(b.id) || 1) - 1) % NCOLORS); }
function beatLinesIn(sc, b) {
  const scene = sceneIn(sc, b.sceneId); if (!scene || !b.range) return [];
  const out = [];
  for (const l of scene.lines) {
    if (l.n < b.range.start.line || l.n > b.range.end.line) continue;
    const t = l.text || '';
    const from = l.n === b.range.start.line ? b.range.start.offset : 0;
    const to = l.n === b.range.end.line ? Math.min(b.range.end.offset, t.length - 1) : t.length - 1;

// sentence segmentation inside a beat (v3): verbs are assigned per sentence
function sentencesIn(sc, b) {
  const res = [];
  for (const l of beatLinesIn(sc, b)) {
    const t = l.text;
    if (l.kind === 'direction') { res.push({ key: l.n + ':' + l.from, line: l.n, s: l.from, e: l.to, text: t.slice(l.from, l.to + 1) }); continue; }
    let st = l.from;
    while (st <= l.to && t[st] === ' ') st++;
    for (let i = st; i <= l.to; i++) {
      if ('.?!…。'.includes(t[i])) {
        let j = i; while (j + 1 <= l.to && /[.?!…。"'”’)\]」』]/.test(t[j + 1])) j++;
        res.push({ key: l.n + ':' + st, line: l.n, s: st, e: j, text: t.slice(st, j + 1) });
        st = j + 1; while (st <= l.to && t[st] === ' ') st++; i = st - 1;
      }
    }
    if (st <= l.to) res.push({ key: l.n + ':' + st, line: l.n, s: st, e: l.to, text: t.slice(st, l.to + 1) });

function verbGroupsIn(sc, b) {

}
const beatTextOf = b => isBS(b) ? (b.text || '') : (b.quote || '');
const inBeat = (b, p) => !isBS(b) && posCmp(b.range.start, p) <= 0 && posCmp(p, b.range.end) <= 0;

/* =====================================================================
   PARTICIPANT
   ===================================================================== */
const P = {

function curKind() { return P.run && P.run.taskStartAt ? 'task' : 'practice'; }

async function startParticipant(preview = false) {

const COLS = ['beats', 'nodes', 'interps', 'links', 'requests', 'responses', 'decisions'];
async function openRun(code, fromEntry = false) {
  P.code = code;
  P.runRef = P.sessRef.collection('runs').doc(code);
  let r;
  try { r = await P.runRef.get(); } catch (e) { r = { exists: false }; }
  if (!r.exists) {
    const data = { code, phase: 'practice', ui: null, createdAt: now(), taskStartAt: null, lastActiveAt: now() };
    try { await P.sessRef.set({ activeCode: code, updatedAt: now() }); await P.runRef.set(data); }
    catch (e) { P.runRef = null; if (fromEntry) renderEntry('저장 권한이 없습니다. 연구자에게 알려 주세요'); else centerMsg('Act & Connect', '저장 권한이 없습니다. 연구자에게 알려 주세요'); return; }
    P.run = data; log('session_join', { code, resumed: false });
  } else {
    P.run = r.data();
    if (fromEntry) write(P.sessRef, { activeCode: code, updatedAt: now() });
    log('session_join', { code, resumed: true });
  }
  const base = P.runRef;
  const snaps = await Promise.all(COLS.map(c => base.collection(c).get().catch(() => ({ docs: [] }))));
  COLS.forEach((c, i) => {
    if (c === 'decisions') P.decisions = snaps[i].docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.t - b.t);
    else snaps[i].docs.forEach(d => P[c].set(d.id, { id: d.id, ...d.data() }));
  });
  for (const x of P.responses.values()) { P.seen.add(x.id); P.shown.add(x.id); }
  for (const x of P.beats.values()) beatSaved.set(x.id, savedSnap(x));
  for (const x of P.interps.values()) interpSaved.set(x.id, { name: x.name || '', body: x.body || '' });
  const u = P.run.ui || {};
  P.ui = { screen: u.screen === 'connect' ? 'connect' : 'collect', sceneId: u.sceneId || null, highlight: !!u.highlight, openBeat: u.openBeatId || null, selInterp: u.selectedInterpId || null, cvScroll: u.canvasScroll || null, viewport: u.viewport || null };
  P.unsubs.push(base.onSnapshot(snap => {
    if (!snap.exists) return;
    const d = snap.data();
    const prevPhase = P.run.phase, prevStart = P.run.taskStartAt;
    P.run.phase = d.phase; if (d.taskStartAt && !P.run.taskStartAt) P.run.taskStartAt = d.taskStartAt;
    if (prevPhase !== P.run.phase || prevStart !== P.run.taskStartAt) renderParticipant();
  }, () => {}));
  P.unsubs.push(base.collection('responses').onSnapshot(snap => {
    let added = false;
    snap.docChanges().forEach(ch => {
      if (ch.type === 'removed') P.responses.delete(ch.doc.id);
      else { P.responses.set(ch.doc.id, { id: ch.doc.id, ...ch.doc.data() }); if (!P.seen.has(ch.doc.id)) { P.seen.add(ch.doc.id); added = true; } }
    });
    for (const x of P.responses.values()) { const q = P.requests.get(x.requestId); if (q) q.status = 'answered'; }
    if (added) { if (P.ui.screen === 'connect') markShown(); else { P.unseen = true; renderTop(); } }
    if (P.ui.screen === 'connect') renderAgent();
  }, () => {}));
  renderParticipant();
}
function markShown() {
  for (const x of P.responses.values()) if (!P.shown.has(x.id)) { P.shown.add(x.id); log('ref_response_shown', { responseId: x.id, requestId: x.requestId, interpId: x.interpId || null, waitMs: x.waitMs || null, cards: (x.cards || []).map(c => c.cardId) }); }
  P.unseen = false;
}
const locked = () => !P.run || P.run.phase === 'done';

/* ---------- shell ---------- */

  if (P.ui.sceneId && P.ui.sceneId !== BACKSTORY && !sceneOf(P.ui.sceneId)) P.ui.sceneId = null;
  if (P.ui.openBeat && !beatOf(P.ui.openBeat)) P.ui.openBeat = null;

    ${P.run.phase === 'done' ? `<div class="done-over"><div class="box"><h1>수고하셨습니다</h1><p class="muted">입력이 잠겼습니다.</p><p style="margin-top:16px"><button type="button" id="nextP" class="ghost">다음 참여자 코드 입력</button></p></div></div>` : ''}`;

/* ---------- Beats pane (replaces the category view) ---------- */
function renderBeats() {

          <div class="q">${esc(g.keys.map(sentText).filter(Boolean).join(' ')) || '<span class="oor">범위 밖</span>'}</div>
          <input type="text" id="verb-${g.id}" data-verb="${g.id}" data-bid="${b.id}" value="${esc(g.verb || '')}" placeholder="상대를 ~하다" aria-label="동사${i + 1} 행동동사" ${dis}></div>`;
      }).join('');
      const mHtml = [...(b.memos || [])].sort((x, y) => posCmp(x.start, y.start)).map(m => {
        const oor = !inBeat(b, m.start) || !inBeat(b, m.end);
        return `<div class="vm"><div class="row"><span class="gname" style="color:var(--warn)">메모</span>${oor ? '<span class="oor">범위 밖</span>' : ''}<span class="spacer"></span>${locked() ? '' : `<button type="button" class="sm ghost danger" data-act="memoDel" data-bid="${b.id}" data-m="${m.id}">삭제</button>`}</div>
          <div class="q">${esc(quoteIn(sc, b.sceneId, m))}</div>
          <textarea id="bmemo-${m.id}" data-bmemo="${m.id}" data-bid="${b.id}" rows="2" aria-label="메모" ${dis}>${esc(m.text || '')}</textarea></div>`;
      }).join('');
      body = `<div class="q full">${esc(b.quote)}</div><div class="bt-ed">
        <label>목적<input type="text" id="purpose-${b.id}" data-purpose="${b.id}" value="${esc(b.purpose || '')}" placeholder="~하기 위해" ${dis}></label>
        <div class="sub">행동동사</div>${gHtml || '<p class="empty" style="padding:0">대본에서 이 비트 안의 문장을 드래그하면 행동동사를 달 수 있습니다.</p>'}
        <div class="sub">메모</div>${mHtml || '<p class="empty" style="padding:0">없음</p>'}
        ${locked() || connect ? '' : `<div class="row"><button type="button" class="sm" data-act="reselect" data-bid="${b.id}">범위 다시 선택</button><span class="spacer"></span><button type="button" class="sm danger" data-act="beatDel" data-bid="${b.id}">비트 삭제</button></div>`}</div>`;
    }

  };
  let html = `<div class="bsec">Backstory<span class="mono">${bs.length || ''}</span><span class="spacer"></span>${!connect && !locked() ? '<button type="button" class="sm" data-act="bsOpen">+ Backstory</button>' : ''}</div>${bs.map(card).join('')}`;
  for (const s of sc.scenes) { const list = sb.filter(b => b.sceneId === s.id); if (list.length) html += `<div class="bsec">${esc(s.title)}</div>${list.map(card).join('')}`; }
  if (!sb.length) html += '<p class="cat-ph">대본에서 문구를 드래그해 비트를 만드세요.</p>';
  el.innerHTML = `<div class="pane-h"><h2>Beats</h2><span class="spacer"></span><span class="muted mono" style="font-size:11px" id="beatCount">${beatCountText(sb)}</span></div>
    <div class="pane-b" id="beatsBody"><div class="bwrap">${html}</div></div>`;
  if (keepTop != null) $('#beatsBody').scrollTop = keepTop;
  if (P.flashBid) { const c = $(`#beats .bt[data-bid="${P.flashBid}"]`); P.flashBid = null; if (c) { c.scrollIntoView({ block: 'nearest' }); c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 1400); } }
}
const beatCountText = sb => sb.length ? `비트 ${sb.length} · 완료 ${sb.filter(isComplete).length}` : '';
function refreshDone(b) {
  const d = isComplete(b);
  $$(`[data-ok="${b.id}"]`).forEach(x => { x.hidden = !d; });
  $$(`[data-jb="${b.id}"]`).forEach(x => x.classList.toggle('done', d));
  const c = $('#beatCount'); if (c) c.textContent = beatCountText(scriptBeats());
}
function openBeat(id, from) {
  const b = beatOf(id); if (!b) return;
  if (P.ui.openBeat !== id) { flushAllEdits(); P.ui.openBeat = id; log('beat_open', { beatId: id, from }); saveUiSoon(); }
  P.flashBid = id;
  if (P.ui.screen === 'collect') {
    const sid = isBS(b) ? BACKSTORY : b.sceneId;
    if (P.ui.sceneId !== sid) { P.ui.sceneId = sid; P.ui.viewport = null; log(sid === BACKSTORY ? 'backstory_open' : 'scene_open', { sceneId: sid, from: 'beat' }); saveUiSoon(); renderJourney(); P.scrollLine = isBS(b) ? null : b.range.start.line; }
    else if (from !== 'script' && !isBS(b)) P.scrollLine = b.range.start.line;
    P.flashHl = id; renderBeats(); renderScripts();
  } else {

    else if (from === 'pane') toast('캔버스로 끌어다 놓으면 노드가 됩니다', lastMouse);
  }
}
function closeBeat() { if (!P.ui.openBeat) return; flushAllEdits(); P.ui.openBeat = null; saveUiSoon(); renderBeats(); }

/* beat persistence */
const beatTimers = new Map(), beatSaved = new Map();
function savedSnap(b) { return { purpose: b.purpose || '', text: b.text || '', verbs: new Map((b.verbs || []).map(g => [g.id, g.verb || ''])), memos: new Map((b.memos || []).map(m => [m.id, m.text || ''])) }; }
function saveBeatSoon(id, after) { clearTimeout(beatTimers.get(id)); beatTimers.set(id, setTimeout(() => { saveBeatNow(id); if (after) after(); }, 800)); }
function saveBeatNow(id) {
  clearTimeout(beatTimers.get(id)); beatTimers.delete(id);
  const b = P.beats.get(id); if (!b) return;
  const prev = beatSaved.get(id) || savedSnap({});
  if ((b.purpose || '') !== prev.purpose) log('beat_edit', { beatId: id, field: 'purpose', before: prev.purpose, after: b.purpose || '' });
  if (isBS(b) && (b.text || '') !== prev.text) log('backstory_edit', { beatId: id, before: prev.text, after: b.text || '' });
  for (const g of b.verbs || []) { const before = prev.verbs.get(g.id); if (before !== undefined && before !== (g.verb || '')) log('verb_edit', { beatId: id, groupId: g.id, before, after: g.verb || '' }); }
  for (const m of b.memos || []) { const before = prev.memos.get(m.id); if (before !== undefined && before !== (m.text || '')) log('beat_memo_edit', { beatId: id, memoId: m.id, before, after: m.text || '' }); }
  beatSaved.set(id, savedSnap(b));
  b.updatedAt = now(); write(ref('beats', id), strip(b)); touchActive();
  refreshDone(b);
}
function newBeatBase(extra) { return { id: rid(), mode: curKind(), source: 'script', sceneId: null, range: null, quote: '', text: '', evidence: null, purpose: '', verbs: [], memos: [], createdAt: now(), updatedAt: now(), ...extra }; }
function storeNewBeat(b) { P.beats.set(b.id, b); beatSaved.set(b.id, savedSnap(b)); write(ref('beats', b.id), strip(b)); touchActive(); }
function deleteBeat(id) {
  const b = P.beats.get(id); if (!b) return;
  const snap = beatSnapIn(curScript(), b, numMap());
  const ls = mine(P.links).filter(l => l.beatId === id);
  ls.forEach(l => { P.links.delete(l.id); write(ref('links', l.id), DEL); });
  if (P.nodes.has(id)) { P.nodes.delete(id); write(ref('nodes', id), DEL); }
  clearTimeout(beatTimers.get(id)); beatTimers.delete(id);
  P.beats.delete(id); write(ref('beats', id), DEL);
  log(isBS(b) ? 'backstory_delete' : 'beat_delete', { beatId: id, snapshot: snap, removedLinks: ls.map(l => l.id) });
  if (P.ui.openBeat === id) P.ui.openBeat = null;
  if (P.reselect === id) P.reselect = null;
  saveUiSoon();
}

/* ---------- Scripts ---------- */
function renderScripts() {
  const el = $('#scripts'); if (!el) return;
  const sc = curScript();
  if (P.ui.sceneId === BACKSTORY) { renderBackstory(el); return; }
  const scene = sceneOf(P.ui.sceneId) || sc.scenes.find(s => s.isTarget) || sc.scenes[0];
  P.ui.sceneId = scene.id;
  const nm = numMap(); const target = sc.targetCharacter || '';
  const info = scriptBeats().filter(b => b.sceneId === scene.id).map(b => {
    const sents = sentencesIn(sc, b); const groups = verbGroupsIn(sc, b);
    const gIdx = new Map(groups.map((g, i) => [g.id, i])); const keyG = new Map(); groups.forEach(g => g.keys.forEach(k => keyG.set(k, g.id)));
    const first = new Map(); groups.forEach(g => { const s = sents.find(x => g.keys.includes(x.key)); if (s) first.set(s.key, g.id); });
    return { b, sents, keyG, gIdx, first };
  });
  const sel = P.sel && P.sel.sceneId === scene.id ? P.sel : null;
  const stateAt = (n, o) => {
    const p = { line: n, offset: o };
    const I = info.find(x => inBeat(x.b, p)); if (!I) return { key: '' };
    const s = I.sents.find(x => x.line === n && o >= x.s && o <= x.e); const g = s ? I.keyG.get(s.key) : null;
    const mu = (I.b.memos || []).some(m => posCmp(m.start, p) <= 0 && posCmp(p, m.end) <= 0);
    return { key: I.b.id + '|' + (g || '') + '|' + (mu ? 1 : 0), I, s, g, mu };
  };
  let lines = '';
  for (const l of scene.lines) {
    const t = l.text || ''; let out = '', i = 0;
    while (i < t.length) {
      const a = stateAt(l.n, i); let j = i, seg = '';
      while (j < t.length) {
        const c = j === i ? a : stateAt(l.n, j); if (c.key !== a.key) break;
        if (c.I) {
          if (posCmp(c.I.b.range.start, { line: l.n, offset: j }) === 0) seg += `<span class="bchip inl ${classIn(c.I.b, nm)}" aria-hidden="true">${labelIn(c.I.b, nm)}</span>`;
          if (c.s && c.s.s === j && c.I.first.get(c.s.key)) seg += `<span class="glab" aria-hidden="true">동사${c.I.gIdx.get(c.I.first.get(c.s.key)) + 1}</span>`;
        }
        const inSel = sel && posCmp(sel.start, { line: l.n, offset: j }) <= 0 && posCmp({ line: l.n, offset: j }, sel.end) <= 0;
        seg += `<span class="c${inSel ? ' selx' : ''}" data-o="${j}">${esc(t[j])}</span>`; j++;
      }
      out += a.I ? `<span class="bk ${classIn(a.I.b, nm)}${a.g ? ' vb' : ''}${a.mu ? ' mu' : ''}${P.reselect === a.I.b.id ? ' resel' : ''} b-${a.I.b.id}" data-bk="${a.I.b.id}">${seg}</span>` : seg;
      i = j;
    }
    const isDir = l.kind === 'direction';

  const catsL = { all: '전체', ai: '레퍼런스', beat: '비트', connect: '연결·해석', view: '화면', mk: '마커' };
  const items = Z.tl.filter(i => Z.tlFilter === 'all' || i.cat === Z.tlFilter);
  el.innerHTML = `<div class="markers" style="margin-bottom:8px"><div class="chipsf">${Object.entries(catsL).map(([k, v]) => `<button type="button" data-tlf="${k}" aria-pressed="${Z.tlFilter === k}">${v}</button>`).join('')}</div><span class="spacer" style="flex:1"></span><button type="button" data-zact="tlReload">새로 불러오기</button></div>
    <p class="muted" style="font-size:12px;margin:0 0 6px">경과 시간은 [과제 시작] 기준입니다. 음수는 연습 단계입니다.</p>
    <div class="tl">${items.map(i => `<div class="tl-item ${i.cat === 'ai' ? 'ai' : ''}${i.cat === 'mk' ? ' mk' : ''}${i.type === 'screen_switch' ? ' mode' : ''}"><span class="el">${t0 ? fmtDur(i.t - t0) : new Date(i.t).toLocaleTimeString('ko-KR', { hour12: false })}</span><span class="cat">${esc(i.catLabel)}</span><span><span class="lbl">${esc(i.label)}</span>${i.detail ? `<br><span class="d">${esc(i.detail)}</span>` : ''}</span></div>`).join('') || '<p class="muted">기록 없음</p>'}</div>`;
}
function buildTimeline(all) {
  const catOfEv = t => t.startsWith('ref_') ? 'ai' : (t.startsWith('beat') || t.startsWith('verb') || t.startsWith('backstory')) ? 'beat' : (t.startsWith('node') || t.startsWith('link') || t.startsWith('interp')) ? 'connect' : 'view';
  const CL = { ai: '레퍼런스', beat: '비트', connect: '연결·해석', view: '화면', mk: '마커' };
  const detail = ev => { const d = ev.data || {}; if (['interp_edit', 'beat_edit', 'verb_edit', 'beat_memo_edit', 'backstory_edit'].includes(ev.type)) return `전: ${d.before || '(없음)'}`; if (ev.type === 'ref_request' && d.snapshot) return (d.snapshot.beats || []).map(b => `${b.label} ${b.where}`).join(' / '); return ''; };
  const items = all.events.map(ev => { const c = catOfEv(ev.type); return { t: ev.t, type: ev.type, cat: c, catLabel: CL[c], label: evLabel(ev), detail: detail(ev) }; });
  for (const r of all.responses) items.push({ t: r.sentAt, type: 'response', cat: 'ai', catLabel: '레퍼런스', label: '응답 전송', detail: (r.cards || []).map(c => c.title).join(' / ') });
  for (const w of all.wizardlog) items.push({ t: w.t, type: 'wizard', cat: 'mk', catLabel: w.kind === 'marker' ? '마커' : w.kind === 'choice' ? '위저드 선택' : '단계', label: w.kind === 'phase' ? `단계 → ${PHASE_L[w.label] || w.label}` : w.label, detail: w.note || '' });
  return items.sort((a, b) => a.t - b.t);
}
document.addEventListener('click', e => { if (MODE !== 'wizard') return; const f = e.target.closest('[data-tlf]'); if (f) { Z.tlFilter = f.dataset.tlf; renderTimeline(); } });

/* right column: queue + pool */
function renderRight() {
  const el = $('#zRight'); if (!el) return;
  const r = selRun();
  if (!r) { el.innerHTML = `<div class="panel-h">요청</div><div class="panel-b"><p class="muted">세션을 고르면 요청이 보입니다.</p><p class="muted">응답 풀 카드 ${Z.pool.size}장</p></div>`; return; }
  const reqs = [...Z.d.requests.values()].sort((a, b) => ((a.status === 'pending') === (b.status === 'pending') ? b.createdAt - a.createdAt : a.status === 'pending' ? -1 : 1));
  if (Z.selReq && !Z.d.requests.has(Z.selReq)) Z.selReq = null;
  if (!Z.selReq) { const p = reqs.find(q => q.status === 'pending'); if (p) selectReq(p, true); }
  const q = Z.selReq && Z.d.requests.get(Z.selReq);
  const keep = { q: ($('#pq') || {}).value, note: ($('#zNote') || {}).value, focus: document.activeElement && document.activeElement.id };
  el.innerHTML = `<div class="panel-h">요청 ${reqs.filter(x => x.status === 'pending').length}건 대기</div>
    <div class="panel-b" style="flex:0 1 auto;max-height:30%">${reqs.map(x => `<button type="button" class="queue-item${x.id === Z.selReq ? ' on' : ''}${x.status !== 'pending' ? ' answered' : ''}" data-q="${x.id}"><span class="t"><b>레퍼런스 · ${esc((x.snapshot && (x.snapshot.name || x.snapshot.label)) || '해석')}</b><span class="spacer"></span>${x.status === 'pending' ? `<span class="wait" data-since="${x.createdAt}">${fmtDur(now() - x.createdAt)}</span>` : '<span class="muted">응답함</span>'}</span><span class="muted">연결 비트 ${(x.snapshot && x.snapshot.beats || []).length}</span></button>`).join('') || '<p class="muted">요청 없음</p>'}</div>
    <div class="panel-h">요청 내용과 응답 풀</div><div class="panel-b">${q ? reqDetail(q) : ''}${poolHtml()}</div>
    <div class="sendbar"><input type="text" id="zNote" placeholder="선택 사유 한 줄 (참여자에게 보이지 않음)" aria-label="선택 사유"><button type="button" class="pri" id="zSend" ${q && q.status === 'pending' && Z.picked.size ? '' : 'disabled'}>보내기 (${Z.picked.size}장)</button></div>`;
  if (keep.q != null && $('#pq')) $('#pq').value = keep.q;
  if (keep.note != null) $('#zNote').value = keep.note;
  if (keep.focus && $('#' + keep.focus)) { const f = $('#' + keep.focus); f.focus(); if (f.setSelectionRange && f.value) f.setSelectionRange(f.value.length, f.value.length); }
}
function selectReq(q, silent) { Z.selReq = q.id; Z.picked.clear(); Z.f.branch = ''; if (!silent) renderRight(); }
function reqText(q) { const s = q.snapshot || {}; return [s.name, s.body, (s.beats || []).map(b => [b.quote, b.purpose, (b.verbs || []).map(v => v.verb + ' ' + v.sentences.join(' ')).join(' '), (b.memos || []).map(m => m.text).join(' ')].join(' ')).join(' ')].filter(Boolean).join(' ').toLowerCase(); }
function branchRank(q) {
  const txt = reqText(q); const by = new Map();
  for (const c of Z.pool.values()) { if (c.type !== 'reference' || !c.branch) continue; if (!by.has(c.branch)) by.set(c.branch, new Set()); (c.keywords || []).forEach(k => by.get(c.branch).add(String(k).toLowerCase())); }
  return [...by.entries()].map(([b, ks]) => ({ b, n: [...ks].reduce((s, k) => s + (k ? txt.split(k).length - 1 : 0), 0) })).sort((a, b) => b.n - a.n);
}
function reqDetail(q) {
  const s = q.snapshot || {}; const ranks = branchRank(q);
  return `<div class="snap"><b>‘${esc(s.name || s.label || '해석')}’</b>
    <div class="p">${s.body ? esc(s.body) : '<span class="muted">(해석 작성 없음)</span>'}</div>
    ${(s.beats || []).map(b => `<div class="sbeat"><b>${esc(b.label)}</b> <span class="muted">${esc(b.where)}</span>${b.purpose ? ` · 목적 <b>${esc(b.purpose)}</b>` : ''}<div class="muted">${esc(b.quote)}</div>${(b.verbs || []).map(v => `<div>· 동사 <b>${esc(v.verb || '(비어 있음)')}</b> <span class="muted">— ${esc(v.sentences.join(' '))}</span></div>`).join('')}${(b.memos || []).map(m => `<div>· 메모 ${esc(m.text || '(빈 메모)')} <span class="muted">— ${esc(m.quote)}</span></div>`).join('')}</div>`).join('')}
    ${ranks.length ? `<div class="branches" aria-label="분기 후보">${ranks.map((x, i) => `<button type="button" data-branch="${esc(x.b)}" class="${i === 0 && x.n ? 'top' : ''}" aria-pressed="${Z.f.branch === x.b}">${esc(x.b)} ${x.n}</button>`).join('')}</div>` : ''}</div>`;
}
function poolHtml() {
  const branches = [...new Set([...Z.pool.values()].map(c => c.branch).filter(Boolean))];
  const qv = (Z.f.q || '').toLowerCase();
  const list = [...Z.pool.values()].filter(c => c.type === 'fallback' || ((!Z.f.branch || c.branch === Z.f.branch) && (!Z.f.polarity || c.polarity === Z.f.polarity) && (!Z.f.src || c.sourceType === Z.f.src) && (!qv || [c.title, c.play, c.character, c.summary, (c.tags || []).join(' ')].join(' ').toLowerCase().includes(qv))))
    .sort((a, b) => (a.type === 'fallback') - (b.type === 'fallback') || String(a.branch || '').localeCompare(String(b.branch || '')) || String(a.id).localeCompare(String(b.id)));
  return `<div class="filters"><select id="pb" aria-label="분기"><option value="">모든 분기</option>${branches.map(b => `<option ${Z.f.branch === b ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>
    <select id="pp" aria-label="유사/대조"><option value="">유사·대조</option><option value="similar" ${Z.f.polarity === 'similar' ? 'selected' : ''}>유사</option><option value="contrast" ${Z.f.polarity === 'contrast' ? 'selected' : ''}>대조</option></select>
    <select id="ps" aria-label="출처 유형"><option value="">모든 출처</option>${Object.entries(SRC_LABEL).map(([k, v]) => `<option value="${k}" ${Z.f.src === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
    <input type="text" id="pq" placeholder="제목·작품·요약·태그 검색" aria-label="검색" value="${esc(Z.f.q)}"></div>
    ${list.map(c => `<label class="pcard${Z.picked.has(c.id) ? ' on' : ''}"><input type="checkbox" data-pick="${esc(c.id)}" ${Z.picked.has(c.id) ? 'checked' : ''}><span><span class="meta">${c.type === 'fallback' ? '<span>범위 밖 안내</span>' : ''}${c.branch ? `<span>분기 ${esc(c.branch)}</span>` : ''}${c.polarity ? `<span>${c.polarity === 'contrast' ? '대조' : '유사'}</span>` : ''}${c.sourceType ? `<span>${esc(srcLabel(c.sourceType))}</span>` : ''}</span><h4>${esc(c.title)}</h4><p>${esc(c.summary || '')}</p></span></label>`).join('') || '<p class="muted">조건에 맞는 카드가 없습니다.</p>'}`;
}
document.addEventListener('click', e => {
  if (MODE !== 'wizard') return;
  const q = e.target.closest('[data-q]'); if (q) { const x = Z.d.requests.get(q.dataset.q); if (x) selectReq(x); return; }
  const br = e.target.closest('[data-branch]'); if (br) { Z.f.branch = Z.f.branch === br.dataset.branch ? '' : br.dataset.branch; renderRight(); return; }
  if (e.target.id === 'zSend') zSend();
});
document.addEventListener('change', e => {
  if (MODE !== 'wizard') return;
  const t = e.target;
  if (t.dataset.pick) { if (t.checked) { if (Z.picked.size >= 4) { t.checked = false; toast('최대 4장까지 보낼 수 있습니다'); return; } Z.picked.add(t.dataset.pick); } else Z.picked.delete(t.dataset.pick); renderRight(); return; }
  if (t.id === 'pb') { Z.f.branch = t.value; renderRight(); }
  if (t.id === 'pp') { Z.f.polarity = t.value; renderRight(); }
  if (t.id === 'ps') { Z.f.src = t.value; renderRight(); }
});
let pqTimer = null;
document.addEventListener('input', e => { if (MODE === 'wizard' && e.target.id === 'pq') { Z.f.q = e.target.value; clearTimeout(pqTimer); pqTimer = setTimeout(renderRight, 300); } });
document.addEventListener('keydown', e => {
  if (MODE !== 'wizard' || !Z.selReq) return;
  if (typing()) return;
  if (/^[1-4]$/.test(e.key)) { const boxes = $$('#zRight [data-pick]'); const b = boxes[+e.key - 1]; if (b) { b.checked = !b.checked; b.dispatchEvent(new Event('change', { bubbles: true })); } }
  if (e.key === 'Enter' && Z.picked.size) { e.preventDefault(); zSend(); }
});
async function zSend() {
  const r = selRun(); const q = Z.selReq && Z.d.requests.get(Z.selReq); if (!r || !q || !Z.picked.size) return;
  const cards = [...Z.picked].map(id => Z.pool.get(id)).filter(Boolean).map(c => ({ cardId: c.id, type: c.type, branch: c.branch || '', polarity: c.polarity || '', title: c.title || '', play: c.play || '', character: c.character || '', sourceType: c.sourceType || '', summary: c.summary || '', quote: c.quote || '', sourceUrl: c.sourceUrl || '' }));
  const note = ($('#zNote') || {}).value || '';
  const btn = $('#zSend'); if (btn) btn.disabled = true;
  try {
    const base = runBase(r); const respId = rid();
    await base.collection('responses').doc(respId).set({ requestId: q.id, interpId: q.interpId || null, cards, sentAt: now(), origin: 'pool', waitMs: now() - q.createdAt });
    await base.collection('requests').doc(q.id).update({ status: 'answered', answeredAt: now(), responseId: respId });
    await db.collection('wizardlog').doc(rid()).set({ runKey: runKey(r), uid: r.uid, code: r.code, t: now(), kind: 'choice', label: '레퍼런스 응답', note, requestId: q.id, cardIds: cards.map(c => c.cardId), branch: Z.f.branch || '' });
    Z.picked.clear(); Z.selReq = null; Z.tl = null; toast(`${cards.length}장 보냈습니다`);
  } catch (e) { toast('보내지 못했습니다' + (e && e.code ? ` (${e.code})` : '')); }
  renderRight();
}

/* live counters */
setInterval(() => {
  $$('[data-since]').forEach(el => { el.textContent = fmtDur(now() - +el.dataset.since); });
  $$('[data-ago]').forEach(el => { el.textContent = ago(+el.dataset.ago || 0); });
  if (MODE === 'wizard' && Z.fresh.size && Z.tab === 'live') { let stale = false; for (const [k, t] of Z.fresh) if (now() - t > 4000) { Z.fresh.delete(k); stale = true; } if (stale) renderLive(); }
}, 1000);

boot();
})();
</script>
