<title>Act &amp; Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
/* Phase 1 v4 — SPEC.md v2. Screen 1: Character Journey | Character Notes | Scripts. Screen 2: Character Notes | Connections | Dramaturgy Agent. */
:root{
  --paper:#eef0ee; --sheet:#fbfbfa; --ink:#1e2226; --muted:#5f666d; --faint:#959ca3; --rule:#d7dad7;
  --accent:#2b5a83; --accent-ink:#ffffff; --accent-soft:#dbe6f0;
  --ok:#2c7a4c; --warn:#a85418; --danger:#ad2a22;
  --c0:#2b5a83; --c1:#2c7a4c; --c2:#c0571b; --c3:#7d5fb0; --c4:#187c88; --c5:#aa3a62; --c6:#8a6d12; --c7:#4f5b66; --cx:#959ca3;
  --shadow:0 6px 24px rgba(20,30,40,.14);
  --f-script:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15181b; --sheet:#1d2125; --ink:#e6e8ea; --muted:#a5adb5; --faint:#78808a; --rule:#323840;
  --accent:#7fb0dc; --accent-ink:#0f1a24; --accent-soft:#233548;
  --ok:#6cc392; --warn:#e3965c; --danger:#ef7d74;
  --c0:#7fb0dc; --c1:#6cc392; --c2:#e9935a; --c3:#ad92dc; --c4:#60c4ce; --c5:#e878a0; --c6:#d6b54a; --c7:#9aa6b2; --cx:#78808a;
  --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15181b; --sheet:#1d2125; --ink:#e6e8ea; --muted:#a5adb5; --faint:#78808a; --rule:#323840;
  --accent:#7fb0dc; --accent-ink:#0f1a24; --accent-soft:#233548;
  --ok:#6cc392; --warn:#e3965c; --danger:#ef7d74;
  --c0:#7fb0dc; --c1:#6cc392; --c2:#e9935a; --c3:#ad92dc; --c4:#60c4ce; --c5:#e878a0; --c6:#d6b54a; --c7:#9aa6b2; --cx:#78808a;
  --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:5px 10px}
button:hover{border-color:var(--muted)}
button:disabled{cursor:not-allowed;opacity:.5}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);border-color:var(--rule)}
button.danger{color:var(--danger)}
button.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
button.sm{font-size:12px;padding:1px 8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],textarea,select{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;width:100%}
textarea{resize:vertical}
#root{height:100%}
.center{height:100%;display:grid;place-items:center;padding:24px 16px;text-align:center}
.center h1{font-family:var(--f-script);font-weight:600;font-size:22px;margin:0 0 6px}
.center p{color:var(--muted);margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.empty{color:var(--faint);padding:12px;margin:0;font-size:13px}
.banner{padding:8px 16px;font-weight:500;text-align:center}
.banner.danger{background:var(--danger);color:#fff}
.narrow-note{display:none;padding:8px 16px;background:var(--accent-soft);color:var(--ink);font-size:13px}
@media (max-width:1100px){.narrow-note{display:block}}
#toast{position:fixed;z-index:90;background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:6px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .15s}
#toast.on{opacity:1}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--hc,var(--cx));flex:0 0 auto}
.k0{--hc:var(--c0)}.k1{--hc:var(--c1)}.k2{--hc:var(--c2)}.k3{--hc:var(--c3)}.k4{--hc:var(--c4)}.k5{--hc:var(--c5)}.k6{--hc:var(--c6)}.k7{--hc:var(--c7)}.kx{--hc:var(--cx)}

/* code entry */
.entry{max-width:340px;margin:0 auto;display:grid;gap:12px;text-align:left}
.entry label{font-weight:600}
.entry input{font-family:var(--f-mono);font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.entry .err{color:var(--danger);font-size:13px;min-height:1.2em}

/* participant shell */
.wrap{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.top .spacer{flex:1}
.top .title{font-family:var(--f-script);font-weight:600}
.stabs{display:inline-flex}
.stabs button{border-radius:0;margin-left:-1px;position:relative;padding:5px 14px}
.stabs button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.stabs button:last-child{border-radius:0 6px 6px 0}
.stabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stabs .dot{position:absolute;top:3px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.startbar{display:flex;align-items:center;justify-content:center;padding:10px;background:var(--accent-soft);border-bottom:1px solid var(--rule)}
.stage{flex:1;min-height:0;display:grid;gap:12px;padding:12px 16px}
.stage.collect{grid-template-columns:minmax(200px,20%) minmax(260px,25%) minmax(0,1fr)}
.stage.connect{grid-template-columns:minmax(240px,22%) minmax(0,1fr) minmax(300px,25%)}
.pane{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.pane-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule);min-height:42px}
.pane-h h2{font-size:13px;margin:0;font-weight:600;letter-spacing:.02em}
.pane-h .spacer{flex:1}
.pane-h .sub{font-family:var(--f-script);font-size:14px;color:var(--muted)}
.pane-b{flex:1;min-height:0;overflow:auto}
.tgl{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}
.tgl input{width:auto}

/* Character Journey */
.jlist{list-style:none;margin:0;padding:8px}
.jrow{width:100%;text-align:left;display:grid;gap:4px;padding:8px 10px;margin-bottom:6px;background:var(--paper);border:1px solid var(--rule);border-radius:6px}
.jrow.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.jrow.absent .jt{color:var(--muted)}
.jrow .jt{font-family:var(--f-script);font-size:14px;line-height:1.35}
.jrow .jm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.jrow .tag{font-size:10px;letter-spacing:.04em;padding:0 6px;border-radius:9px;border:1px solid currentColor}
.jdots{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-height:12px}
.jdot{display:inline-flex;align-items:center;gap:2px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.jdot.dim{opacity:.2}

/* Character Notes */
.nwrap{padding:8px 10px 24px;display:grid;gap:10px;align-content:start}
.cat{border:1px solid var(--rule);border-radius:8px;background:var(--paper);overflow:hidden}
.cat.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.cat.focus{border-color:var(--hc)}
.cat-h{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--rule)}
.cat-h .grip{cursor:grab;color:var(--faint);font-size:12px;user-select:none;padding:0 2px}
.cat-h .cdot-btn{border:0;background:transparent;padding:2px}
.cat-h input{border-color:transparent;background:transparent;padding:2px 4px;font-weight:600;font-size:14px}
.cat-h input:focus{background:var(--sheet);border-color:var(--rule)}
.cat-h .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cat-h button.sm{white-space:nowrap}
.cat-h button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cat-b{display:grid;gap:4px;padding:6px}
.cat-b .empty{padding:6px 4px}
.mi{border:1px solid transparent;border-left:3px solid var(--hc);border-radius:4px;background:var(--sheet);padding:5px 8px;display:grid;gap:3px;cursor:pointer}
.mi:hover,.mi.hov{border-color:var(--rule);border-left-color:var(--hc)}
.mi.flash{background:var(--accent-soft)}
.mi .w{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mi .w .spacer{flex:1}
.mi .w .oncv{font-family:var(--f-ui);font-size:10px;border:1px solid var(--muted);border-radius:8px;padding:0 5px}
.mi .q{font-family:var(--f-script);font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mi .memo{font-size:12px;color:var(--muted)}
.mi .acts{display:flex;gap:4px;align-items:center;opacity:0;transition:opacity .12s}
.mi:hover .acts,.mi:focus-within .acts{opacity:1}
.mi .acts .memo-in{flex:1;min-width:0}
.mi .acts select{width:auto;font-size:12px;padding:1px 4px}
.mi input.memo-in{font-size:12px;padding:3px 6px}
.cat-ph{color:var(--faint);font-size:13px;padding:6px 4px;line-height:1.6}

/* Scripts */
.script-scroll{background:var(--paper)}
.sheet{max-width:48em;margin:16px auto 40px;background:var(--sheet);border:1px solid var(--rule);padding:24px 28px 44px}
.scene-title{font-family:var(--f-script);font-weight:600;font-size:17px;margin:0 0 14px;padding-left:4.2em}
.ln{display:grid;grid-template-columns:3.6em minmax(0,1fr);column-gap:.6em;font-family:var(--f-script);font-size:16px;line-height:1.85}
.ln .no{font-family:var(--f-mono);font-size:11px;color:var(--faint);text-align:right;padding-top:.45em;user-select:none;-webkit-user-select:none}
.ln .lt{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.ln .spk{font-weight:600;margin-right:.5em;font-family:var(--f-ui);font-size:14px;user-select:none;-webkit-user-select:none}
.ln.dir .lt{font-style:italic;color:var(--muted)}
.ln.tline .spk{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.c{cursor:text}
.mo{background:color-mix(in srgb,var(--hc) 22%,transparent);border-radius:2px;cursor:pointer;transition:background .12s}
.mo.ov{box-shadow:inset 0 -2px 0 var(--hc2,var(--hc))}
.mo.hov,.mo.flash{background:color-mix(in srgb,var(--hc) 45%,transparent)}
.mo.dim{background:color-mix(in srgb,var(--hc) 7%,transparent)}
.selx{background:var(--accent-soft);outline:1px solid var(--accent)}
#fmenu{position:fixed;z-index:85;background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);border-radius:8px;padding:4px;display:flex;gap:4px;flex-wrap:wrap;max-width:320px}
#fmenu[hidden]{display:none}
#fmenu button{border-color:transparent;display:inline-flex;align-items:center;gap:6px}
#fmenu button:hover{background:var(--accent-soft)}
#fmenu .lab{width:100%;font-size:11px;color:var(--muted);padding:2px 6px}
#fmenu form{display:flex;gap:4px;width:100%}
#fmenu form input{font-size:13px;padding:3px 6px}

/* Backstory panel */
.bs{max-width:44em;margin:16px auto 40px;background:var(--sheet);border:1px solid var(--rule);padding:22px 26px 30px;display:grid;gap:14px}
.bs h3{font-family:var(--f-script);font-weight:600;font-size:17px;margin:0}
.bs .help{font-size:13px;color:var(--muted);margin:-8px 0 0}
.bs-form{display:grid;gap:8px;border:1px dashed var(--rule);border-radius:8px;padding:10px}
.bs-form .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bs-form .row select{width:auto}
.bs-form .row input{width:5em}
.bs-item{border-left:3px solid var(--hc);background:var(--paper);border-radius:4px;padding:8px 10px;display:grid;gap:6px}
.bs-item textarea{font-family:var(--f-script);font-size:15px;background:transparent}
.bs-item .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}

/* Connections canvas */
.cv{position:relative;flex:1;min-height:0;overflow:auto;background:
  radial-gradient(circle,var(--rule) 1px,transparent 1.4px) 0 0/22px 22px,var(--paper);cursor:grab}
.cv.panning{cursor:grabbing}
.cv.drop{outline:2px dashed var(--accent);outline-offset:-4px}
.cv-in{position:relative}
.cv svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.cv svg path.ln-v{fill:none;stroke:var(--muted);stroke-width:1.6}
.cv svg path.ln-hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
.cv svg path.ln-v.sel{stroke:var(--accent);stroke-width:2.6}
.cv svg path.ln-tmp{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.node{position:absolute;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:default}
.node .nh{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--rule);cursor:move;font-size:12px;user-select:none;-webkit-user-select:none}
.node .nh .spacer{flex:1}
.node .nh button{font-size:11px;padding:0 6px;line-height:18px}
.mnode{width:220px}
.mnode .nb{padding:6px 10px 8px;display:grid;gap:3px}
.mnode .w{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mnode .q{font-family:var(--f-script);font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mnode .memo{font-size:12px;color:var(--muted)}
.mnode.hov{border-color:var(--ink)}
.port{position:absolute;right:-8px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--sheet);border:2px solid var(--hc,var(--muted));cursor:crosshair}
.port:hover{background:var(--hc,var(--muted))}
.inode{width:300px;border:1.5px solid var(--ink)}
.inode.sel{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 4px var(--accent)}
.inode.target{outline:2px dashed var(--accent);outline-offset:3px}
.inode .nb{padding:8px 10px 10px;display:grid;gap:6px}
.inode label{font-size:11px;color:var(--muted);display:grid;gap:2px}
.inode input{font-family:var(--f-script);font-weight:600;font-size:15px;padding:4px 6px}
.inode textarea{font-family:var(--f-script);font-size:14px;line-height:1.5;padding:4px 6px;min-height:5.2em}
.inode .inport{position:absolute;left:-7px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--ink)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:2px 8px;text-align:left}
.chip:hover{border-color:var(--accent)}
.cv-empty{position:absolute;left:24px;top:20px;color:var(--faint);font-size:13px;pointer-events:none;max-width:28em;line-height:1.6}
.lnx{position:absolute;transform:translate(-50%,-50%);font-size:11px;padding:0 6px;line-height:18px;border-radius:9px;z-index:3}

/* Dramaturgy Agent */
.disclose{margin:0;padding:6px 12px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--rule);background:var(--paper)}
.ag-tools{display:grid;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.ag-tools .lab{font-size:11px;color:var(--muted)}
.ag-tools .tgt{font-family:var(--f-script);font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.chipsf{display:flex;gap:4px;flex-wrap:wrap}
.chipsf button{font-size:12px;padding:1px 8px;border-radius:12px}
.chipsf button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.thread{flex:1;min-height:0;overflow:auto;padding:10px 12px;display:grid;gap:14px;align-content:start}
.req{display:grid;gap:6px}
.req-h{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.req-h b{color:var(--ink);font-weight:600}
.req-intro{font-size:13px;margin:0}
.waiting{color:var(--muted);font-size:13px}
.rcard{border:1px solid var(--rule);border-radius:8px;padding:10px;display:grid;gap:6px;background:var(--paper)}
.rcard.flash{outline:2px solid var(--accent)}
.rcard .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.rcard .meta .pill{border:1px solid var(--rule);border-radius:10px;padding:0 6px}
.rcard h4{margin:0;font-size:14px;font-family:var(--f-script);font-weight:600}
.rcard p{margin:0;font-size:13px}
.rcard blockquote{margin:0;padding-left:8px;border-left:2px solid var(--rule);font-family:var(--f-script);font-size:13px;color:var(--muted)}
.rcard a{color:var(--accent);font-size:12px}
.decide{display:flex;gap:4px;flex-wrap:wrap}
.decide button{font-size:12px;padding:2px 8px}
.decide button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.done-over{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--paper) 88%,transparent);display:grid;place-items:center;padding:16px}
.done-over .box{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:28px 32px;text-align:center;box-shadow:var(--shadow)}
.done-over h1{font-family:var(--f-script);margin:0 0 12px;font-size:24px}

/* wizard */
.wz{height:100%;display:grid;grid-template-columns:230px minmax(0,1fr) minmax(340px,420px);grid-template-rows:auto minmax(0,1fr);gap:12px;padding:12px 16px}
.wz-h{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wz-h h1{font-size:15px;margin:0;font-weight:600}
.wz-h h1 span{font-weight:400;color:var(--muted)}
.wz-h .spacer{flex:1}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.panel-h{padding:8px 12px;border-bottom:1px solid var(--rule);font-size:12px;letter-spacing:.06em;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-b{flex:1;min-height:0;overflow:auto;padding:10px 12px}
.runbtn{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;margin-bottom:6px;padding:8px}
.runbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.runbtn .code{font-family:var(--f-mono);font-weight:500;font-size:15px}
.runbtn .ago{grid-column:1/-1;font-size:11px;color:var(--muted)}
.badge{background:var(--danger);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;font-family:var(--f-mono)}
.phase{font-size:11px;border-radius:10px;padding:0 7px;border:1px solid var(--rule);color:var(--muted)}
.phase.task{border-color:var(--accent);color:var(--accent)}
.phase.done{border-color:var(--ok);color:var(--ok)}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 12px}
.kv div{background:var(--paper);border-radius:6px;padding:6px 8px}
.kv dt{font-size:11px;color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.sec{margin:14px 0 6px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.mbox{border:1px solid var(--rule);border-radius:6px;padding:8px 10px;margin-bottom:8px;background:var(--paper)}
.mbox.fresh,.mrow.fresh{outline:2px solid var(--warn)}
.mbox .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mbox .p{font-family:var(--f-script);font-size:15px;margin:4px 0}

.mrow{font-size:13px;border-left:3px solid var(--hc,var(--cx));padding:3px 8px;margin:4px 0;background:var(--sheet)}
.jsum{display:flex;gap:6px;flex-wrap:wrap}
.jsum span{font-size:12px;background:var(--paper);border-radius:6px;padding:2px 8px}
.evlist{font-size:12px;font-family:var(--f-mono);display:grid;gap:2px}
.evlist div{display:grid;grid-template-columns:4.5em 1fr;gap:8px}
.markers{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.queue-item{width:100%;text-align:left;display:grid;gap:2px;margin-bottom:6px;padding:8px}

.snap{background:var(--paper);border-radius:6px;padding:8px;font-size:13px;margin-bottom:8px;display:grid;gap:3px}
.snap .p{font-family:var(--f-script)}
.branches{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}

.pcard{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;border:1px solid var(--rule);border-radius:6px;padding:8px;margin-bottom:6px;cursor:pointer;background:var(--paper)}

.tl{display:grid;gap:0;font-size:13px}
.tl-item{display:grid;grid-template-columns:5.5em 7em minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px solid var(--rule)}
.tl-item .el{font-family:var(--f-mono);color:var(--muted)}
.tl-item .cat{font-size:11px}
.tl-item.ai{background:var(--accent-soft)}
.tl-item.mk{background:color-mix(in srgb,var(--c6) 18%,transparent)}

.tl-item .d{overflow-wrap:anywhere;color:var(--muted);font-size:12px}
.tl-item .lbl{color:var(--ink);font-size:13px}
@media (max-width:960px){
  .wz{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .wz .panel{max-height:70vh}
}
</style>
<div id="root"><div class="center"><div><h1>Act &amp; Connect</h1><p>불러오는 중…</p></div></div></div>
<div id="fmenu" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const rid = () => Math.random().toString(36).slice(2, 9) + now().toString(36).slice(-5);
const root = $('#root');
const pad = n => String(n).padStart(2, '0');
const fmtDur = ms => { const neg = ms < 0; ms = Math.abs(ms); const s = Math.floor(ms / 1000); const m = Math.floor(s / 60); const h = Math.floor(m / 60); const core = h ? `${h}:${pad(m % 60)}:${pad(s % 60)}` : `${pad(m)}:${pad(s % 60)}`; return (neg ? '-' : '') + core; };
const ago = t => { if (!t) return '활동 없음'; const s = Math.round((now() - t) / 1000); if (s < 60) return `${s}초 전`; const m = Math.round(s / 60); if (m < 60) return `${m}분 전`; return `${Math.round(m / 60)}시간 전`; };
const posCmp = (a, b) => (a.line - b.line) || (a.offset - b.offset);
const BACKSTORY = '__backstory';
const NCOLORS = 8;
const SRC_LABEL = { play: '희곡', performance: '공연', interview: '배우 인터뷰', history: '역사·문화 자료' };
const srcLabel = s => SRC_LABEL[s] || s || '';
const DISCLOSE = '응답은 연구진이 미리 준비한 자료 중에서 골라 보내 드립니다.';
const AGENT_INTRO = '비슷한 상황에 처한 인물들을 알려드릴게요. 이 인물들은 어떻게 행동했는지 살펴보세요.';
const MIN_LINKS = 2;

let db = null, user = null, downloads = null, uid = null, isOwner = false;
const cfg = { script: null, practice: null, settings: { showPolarity: false } };
let MODE = null; // 'participant' | 'wizard'
const cfgListeners = [];

/* ---------- toast & helpers ---------- */
let toastTimer = null, lastMouse = { x: 0, y: 0 };
document.addEventListener('mousemove', e => { lastMouse = { x: e.clientX, y: e.clientY }; }, { passive: true });
function toast(msg, at) {
  const t = $('#toast'); t.textContent = msg;
  const p = at || { x: window.innerWidth / 2, y: window.innerHeight - 60 };
  t.style.left = Math.max(8, Math.min(window.innerWidth - 280, p.x + 12)) + 'px';
  t.style.top = Math.max(8, Math.min(window.innerHeight - 40, p.y + 14)) + 'px';
  t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 3000);
}
function centerMsg(title, sub = '') { root.innerHTML = `<div class="center"><div><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}</div></div>`; }
function armConfirm(btn, label = '정말 삭제') { if (btn.dataset.armed === '1') return true; btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = label; btn.classList.add('armed'); setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = old; btn.classList.remove('armed'); } }, 3000); return false; }
const typing = () => { const a = document.activeElement; return a && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || (a.tagName === 'INPUT' && a.type === 'text')); };

/* ---------- serialized writes: one in flight per document ---------- */
const DEL = { del: true };
const W = new Map();
let writeErrorShown = false;
function write(ref, data, how = 'set') {
  const k = ref.path; let w = W.get(k);
  if (!w) { w = { ref, q: [], running: false }; W.set(k, w); }
  if (how === 'set' || data === DEL) w.q = [{ data, how }]; else w.q.push({ data, how });
  if (!w.running) pump(w);
}
async function pump(w) {
  w.running = true;
  while (w.q.length) {
    const { data, how } = w.q.shift();
    try {
      if (data === DEL) await w.ref.delete();
      else if (how === 'update') await w.ref.update(data);
      else await w.ref.set(data);
    } catch (e) { onWriteError(e); }
  }
  w.running = false;
}
function onWriteError(e) {
  const code = e && e.code;
  if (code === 'unavailable') return;
  if (writeErrorShown) return;
  writeErrorShown = true;
  const msg = code === 'quota_exceeded' ? '저장 공간이 가득 찼습니다. 연구자에게 알려 주세요' : '저장 권한이 없습니다. 연구자에게 알려 주세요';
  const b = document.createElement('div'); b.className = 'banner danger'; b.textContent = msg; b.id = 'writeBanner';
  const wrap = $('.wrap') || root; wrap.prepend(b);
}
const strip = o => { const { id, ...r } = o; return r; };

/* ---------- boot ---------- */
async function boot() {
  if (!window.claude || typeof window.claude.use !== 'function') { centerMsg('Act & Connect', '초대받은 계정으로 로그인한 뒤 다시 열어 주세요'); return; }
  try { [user, db] = await Promise.all([claude.use('user'), claude.use('db')]); } catch (e) { user = null; db = null; }
  if (!user || !db) { centerMsg('Act & Connect', '초대받은 계정으로 로그인한 뒤 다시 열어 주세요'); return; }
  downloads = await claude.use('downloads').catch(() => null);
  isOwner = await user.isOwner().catch(() => false);
  const me = await user.me().catch(() => null);
  uid = me && me.id;
  if (!uid) { centerMsg('Act & Connect', '초대받은 계정으로 로그인한 뒤 다시 열어 주세요'); return; }
  ['script', 'practice', 'settings'].forEach(k => {
    db.doc('config/' + k).onSnapshot(s => {
      if (k === 'settings') cfg.settings = s.exists ? { showPolarity: false, ...s.data() } : { showPolarity: false };
      else cfg[k] = s.exists ? s.data() : null;
      cfgListeners.forEach(fn => fn(k));
    }, () => {});
  });
  await new Promise(r => setTimeout(r, 400));
  if (isOwner) startWizard(); else startParticipant();
}

/* ---------- shared script helpers (participant + wizard) ---------- */
function scriptFor(kind) { return kind === 'task' ? cfg.script : cfg.practice; }
function sceneIn(sc, id) { return sc && (sc.scenes || []).find(s => s.id === id); }
function sceneIdx(sc, id) { if (id === BACKSTORY || !id) return -1; return sc ? sc.scenes.findIndex(s => s.id === id) : 0; }
function sceneShortIn(sc, id) { if (id === BACKSTORY) return 'Backstory'; const s = sceneIn(sc, id); return s ? (s.title || '').split('·')[0].trim() : ''; }
function targetAppears(sc, scene) { const t = sc && sc.targetCharacter; return !t || scene.lines.some(l => l.kind !== 'direction' && l.speaker === t); }
function quoteIn(sc, sceneId, range) {
  const scene = sceneIn(sc, sceneId); if (!scene || !range) return '';
  const parts = [];
  for (const l of scene.lines) {
    if (l.n < range.start.line || l.n > range.end.line) continue;
    const t = l.text || ''; const f = l.n === range.start.line ? range.start.offset : 0; const to = l.n === range.end.line ? range.end.offset : t.length - 1;
    parts.push(t.slice(f, to + 1));
  }
  return parts.join(' ');
}
function momentWhereIn(sc, m) {
  if (m.source === 'backstory') return 'Backstory' + (m.evidence && m.evidence.sceneId ? ` (근거 ${sceneShortIn(sc, m.evidence.sceneId)}${m.evidence.line ? ' ' + m.evidence.line + '행' : ''})` : '');
  return `${sceneShortIn(sc, m.sceneId)} ${m.range ? (m.range.start.line === m.range.end.line ? m.range.start.line + '행' : m.range.start.line + '–' + m.range.end.line + '행') : ''}`;
}
function momentTextOf(m) { return m.source === 'backstory' ? (m.text || '') : (m.quote || ''); }
function sortMoments(sc, list) {
  return [...list].sort((a, b) => {
    const ab = a.source === 'backstory', bb = b.source === 'backstory';
    if (ab !== bb) return ab ? -1 : 1;
    if (ab) return a.createdAt - b.createdAt;
    return (sceneIdx(sc, a.sceneId) - sceneIdx(sc, b.sceneId)) || posCmp(a.range.start, b.range.start) || a.createdAt - b.createdAt;
  });
}

/* =====================================================================
   PARTICIPANT
   ===================================================================== */
const P = {
  sessRef: null, runRef: null, run: null, code: null,
  categories: new Map(), moments: new Map(), nodes: new Map(), interps: new Map(), links: new Map(),
  requests: new Map(), responses: new Map(), decisions: [],
  ui: { screen: 'collect', sceneId: null, highlight: false, focusCat: null, selInterp: null, cvScroll: null, viewport: null },
  sel: null, fmenuStage: null, unseen: false, seen: new Set(), shown: new Set(), lastType: null, unsubs: [], preview: false,
  agentFilter: 'all', selLink: null, flashMid: null, scrollLine: null, scrollMem: {}
};
const L = { buf: [], flushing: false };
function log(type, data = {}, target = null) {
  if (!P.runRef) return;
  L.buf.push({ t: now(), type, target, data });
  P.lastType = type;
  if (L.buf.length >= 25) flush();
}
async function flush() {
  if (L.flushing || !L.buf.length || !P.runRef) return;
  L.flushing = true;
  const batch = L.buf.splice(0);
  const t = now();
  try { await P.runRef.collection('events').doc('e' + t + '_' + Math.random().toString(36).slice(2, 6)).set({ seq: t, events: batch }); }
  catch (e) { L.buf.unshift(...batch); if (e && e.code !== 'unavailable') onWriteError(e); }
  L.flushing = false;
}
setInterval(flush, 10000);
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });

let uiTimer = null;
function saveUiSoon() {
  // throttle (not debounce): continuous activity must not postpone the save indefinitely
  if (uiTimer) return;
  uiTimer = setTimeout(() => {
    uiTimer = null;
    if (!P.runRef || !P.run) return;
    const u = P.ui;
    write(P.runRef, { ui: { screen: u.screen, sceneId: u.sceneId || null, highlight: !!u.highlight, focusCategoryId: u.focusCat || null, selectedInterpId: u.selInterp || null, canvasScroll: u.cvScroll || null, viewport: u.viewport || null }, lastActiveAt: now() }, 'update');
  }, 1000);
}

function curKind() { return P.run && P.run.taskStartAt ? 'task' : 'practice'; }
function curScript() { return scriptFor(curKind()); }
function sceneOf(id) { return sceneIn(curScript(), id); }
function mine(map) { const k = curKind(); return [...map.values()].filter(x => x.mode === k); }
function cats() { return mine(P.categories).sort((a, b) => (a.order - b.order) || (a.createdAt - b.createdAt)); }
function catOf(id) { const c = id && P.categories.get(id); return c && c.mode === curKind() ? c : null; }
function catClass(id) { const c = catOf(id); return c ? 'k' + (c.color % NCOLORS) : 'kx'; }
function catName(id) { const c = catOf(id); return c ? (c.name || '이름 없는 범주') : '미분류'; }
function moments() { return sortMoments(curScript(), mine(P.moments)); }
function linksOf(interpId) { return mine(P.links).filter(l => l.interpId === interpId && P.moments.has(l.momentId)); }
function interps() { return mine(P.interps).sort((a, b) => a.createdAt - b.createdAt); }
function interpLabel(it) { const i = interps().findIndex(x => x.id === it.id); return (it.name || '').trim() || `해석 ${i + 1}`; }
function canRequest(it) { return !!it && linksOf(it.id).length >= MIN_LINKS && !!(it.body || '').trim(); }
const ref = (col, id) => P.runRef.collection(col).doc(id);
let activeTimer = null;
function touchActive() { clearTimeout(activeTimer); activeTimer = setTimeout(saveUiSoon, 50); }

async function startParticipant(preview = false) {
  MODE = 'participant'; P.preview = preview;
  P.sessRef = db.doc('sessions/' + uid);
  let s;
  try { s = await P.sessRef.get(); } catch (e) { s = { exists: false }; }
  const active = s.exists ? (s.data().activeCode || null) : null;
  if (!cfgListeners.includes(onCfgParticipant)) cfgListeners.push(onCfgParticipant);
  if (active) await openRun(active); else renderEntry();
}
function onCfgParticipant() { if (MODE === 'participant' && P.run) renderParticipant(); }

function renderEntry(err = '') {
  root.innerHTML = `<div class="wrap">${P.preview ? previewBar() : ''}<div class="center"><form class="entry" id="entry" novalidate>
    <h1 style="text-align:center">Act &amp; Connect</h1>
    <label for="codeInput">참여자 코드</label>
    <input id="codeInput" type="text" autocomplete="off" inputmode="latin" placeholder="P01" maxlength="3" aria-describedby="codeErr">
    <div class="err" id="codeErr">${esc(err)}</div>
    <button class="pri" type="submit">입장</button></form></div></div>`;
  bindPreviewBar();
  const f = $('#entry'), inp = $('#codeInput'); inp.focus();
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const code = inp.value.trim().toUpperCase();
    if (!/^P\d{2}$/.test(code)) { $('#codeErr').textContent = 'P와 숫자 두 자리로 입력해 주세요 (예: P01)'; return; }
    f.querySelector('button').disabled = true;
    await openRun(code, true);
  });
}
function previewBar() { return `<div class="banner" style="background:var(--accent-soft)">참여자 화면 미리보기 · 소유자 계정의 연습용 기록입니다 <button type="button" id="backConsole" style="margin-left:8px">콘솔로 돌아가기</button></div>`; }
function bindPreviewBar() { const b = $('#backConsole'); if (b) b.onclick = () => { stopParticipant(); startWizard(); }; }
function resetUi() { P.ui = { screen: 'collect', sceneId: null, highlight: false, focusCat: null, selInterp: null, cvScroll: null, viewport: null }; }
function stopParticipant() {
  flush(); clearTimeout(uiTimer); uiTimer = null;
  P.unsubs.forEach(u => { try { u(); } catch (e) {} }); P.unsubs = []; P.runRef = null; P.run = null;
  ['categories', 'moments', 'nodes', 'interps', 'links', 'requests', 'responses'].forEach(k => P[k].clear());
  P.decisions = []; P.seen.clear(); P.shown.clear(); P.sel = null; P.selLink = null; resetUi(); hideFmenu();
}

const COLS = ['categories', 'moments', 'nodes', 'interps', 'links', 'requests', 'responses', 'decisions'];
async function openRun(code, fromEntry = false) {
  P.code = code;
  P.runRef = P.sessRef.collection('runs').doc(code);
  let r;
  try { r = await P.runRef.get(); } catch (e) { r = { exists: false }; }
  if (!r.exists) {
    const data = { code, phase: 'practice', ui: null, createdAt: now(), taskStartAt: null, lastActiveAt: now() };
    try { await P.sessRef.set({ activeCode: code, updatedAt: now() }); await P.runRef.set(data); }
    catch (e) { P.runRef = null; if (fromEntry) renderEntry('저장 권한이 없습니다. 연구자에게 알려 주세요'); else centerMsg('Act & Connect', '저장 권한이 없습니다. 연구자에게 알려 주세요'); return; }
    P.run = data; log('session_join', { code, resumed: false });
  } else {
    P.run = r.data();
    if (fromEntry) write(P.sessRef, { activeCode: code, updatedAt: now() });
    log('session_join', { code, resumed: true });
  }
  const base = P.runRef;
  const snaps = await Promise.all(COLS.map(c => base.collection(c).get().catch(() => ({ docs: [] }))));
  COLS.forEach((c, i) => {
    if (c === 'decisions') P.decisions = snaps[i].docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.t - b.t);
    else snaps[i].docs.forEach(d => P[c].set(d.id, { id: d.id, ...d.data() }));
  });
  for (const x of P.responses.values()) { P.seen.add(x.id); P.shown.add(x.id); }
  for (const x of P.moments.values()) momentSaved.set(x.id, { memo: x.memo || '', text: x.text || '', categoryId: x.categoryId || null });
  for (const x of P.interps.values()) interpSaved.set(x.id, { name: x.name || '', body: x.body || '' });
  for (const x of P.categories.values()) catSaved.set(x.id, x.name || '');
  const u = P.run.ui || {};
  P.ui = { screen: u.screen === 'connect' ? 'connect' : 'collect', sceneId: u.sceneId || null, highlight: !!u.highlight, focusCat: u.focusCategoryId || null, selInterp: u.selectedInterpId || null, cvScroll: u.canvasScroll || null, viewport: u.viewport || null };
  P.unsubs.push(base.onSnapshot(snap => {
    if (!snap.exists) return;
    const d = snap.data();
    const prevPhase = P.run.phase, prevStart = P.run.taskStartAt;
    P.run.phase = d.phase; if (d.taskStartAt && !P.run.taskStartAt) P.run.taskStartAt = d.taskStartAt;
    if (prevPhase !== P.run.phase || prevStart !== P.run.taskStartAt) renderParticipant();
  }, () => {}));
  P.unsubs.push(base.collection('responses').onSnapshot(snap => {
    let added = false;
    snap.docChanges().forEach(ch => {
      if (ch.type === 'removed') P.responses.delete(ch.doc.id);
      else { P.responses.set(ch.doc.id, { id: ch.doc.id, ...ch.doc.data() }); if (!P.seen.has(ch.doc.id)) { P.seen.add(ch.doc.id); added = true; } }
    });
    for (const x of P.responses.values()) { const q = P.requests.get(x.requestId); if (q) q.status = 'answered'; }
    if (added) { if (P.ui.screen === 'connect') markShown(); else { P.unseen = true; renderTop(); } }
    if (P.ui.screen === 'connect') renderAgent();
  }, () => {}));
  renderParticipant();
}
function markShown() {
  for (const x of P.responses.values()) if (!P.shown.has(x.id)) { P.shown.add(x.id); log('ref_response_shown', { responseId: x.id, requestId: x.requestId, interpId: x.interpId || null, waitMs: x.waitMs || null, cards: (x.cards || []).map(c => c.cardId) }); }
  P.unseen = false;
}
const locked = () => !P.run || P.run.phase === 'done';

/* ---------- shell ---------- */
function renderParticipant() {
  if (MODE !== 'participant' || !P.run) return;
  const sc = curScript();
  hideFmenu();
  if (!sc || !sc.scenes || !sc.scenes.length) { root.innerHTML = `<div class="wrap">${P.preview ? previewBar() : ''}<div class="center"><div><h1>연구 준비 중입니다</h1></div></div></div>`; bindPreviewBar(); return; }
  if (P.ui.sceneId && P.ui.sceneId !== BACKSTORY && !sceneOf(P.ui.sceneId)) P.ui.sceneId = null;
  if (P.ui.focusCat && !catOf(P.ui.focusCat)) P.ui.focusCat = null;
  if (P.ui.selInterp && !(P.interps.get(P.ui.selInterp) || {}).mode) P.ui.selInterp = null;
  if (P.ui.selInterp && P.interps.get(P.ui.selInterp).mode !== curKind()) P.ui.selInterp = null;

function renderScripts() {
  const el = $('#scripts'); if (!el) return;
  const sc = curScript();
  if (P.ui.sceneId === BACKSTORY) { renderBackstory(el); return; }
  const scene = sceneOf(P.ui.sceneId) || sc.scenes.find(s => s.isTarget) || sc.scenes[0];
  P.ui.sceneId = scene.id;
  const ms = mine(P.moments).filter(m => m.source !== 'backstory' && m.sceneId === scene.id).sort((a, b) => a.createdAt - b.createdAt);
  const fc = P.ui.focusCat; const target = sc.targetCharacter || '';
  const sel = P.sel && P.sel.sceneId === scene.id ? P.sel : null;
  let lines = '';
  for (const l of scene.lines) {
    const t = l.text || '';
    const cover = i => ms.filter(m => posCmp(m.range.start, { line: l.n, offset: i }) <= 0 && posCmp({ line: l.n, offset: i }, m.range.end) <= 0);
    let chars = '', i = 0;
    while (i < t.length) {
      const cv = cover(i); const key = cv.map(m => m.id).join(' ');
      let j = i, seg = '';
      while (j < t.length && cover(j).map(m => m.id).join(' ') === key) {
        const inSel = sel && posCmp(sel.start, { line: l.n, offset: j }) <= 0 && posCmp({ line: l.n, offset: j }, sel.end) <= 0;
        seg += `<span class="c${inSel ? ' selx' : ''}" data-o="${j}">${esc(t[j])}</span>`; j++;
      }
      if (cv.length) {
        const top = cv[cv.length - 1]; const under = cv.length > 1 ? cv[cv.length - 2] : null;
        const dim = fc && !cv.some(m => m.categoryId === fc);
        const uc = under ? catOf(under.categoryId) : null;
        const hc2 = under ? ` style="--hc2:var(--c${uc ? uc.color % NCOLORS : 'x'})"` : '';
        chars += `<span class="mo ${catClass(top.categoryId)}${under ? ' ov' : ''}${dim ? ' dim' : ''} ${cv.map(m => 'm-' + m.id).join(' ')}" data-mos="${key}"${hc2}>${seg}</span>`;
      } else chars += seg;
      i = j;
    }
    const isDir = l.kind === 'direction';
    const tl = !isDir && P.ui.highlight && target && l.speaker === target;
    lines += `<div class="ln${isDir ? ' dir' : ''}${tl ? ' tline' : ''}" data-n="${l.n}"><span class="no">${l.n}</span><div class="lt">${!isDir && l.speaker ? `<span class="spk">${esc(l.speaker)}</span>` : ''}${chars}</div></div>`;
  }

    <div class="pane-b script-scroll" id="scriptScroll"><div class="sheet script" id="scriptText" data-scene="${esc(scene.id)}"><h3 class="scene-title">${esc(scene.title)}</h3>${lines}</div></div>`;
  const ss = $('#scriptScroll');
  if (P.scrollLine != null) { const ln = ss.querySelector(`.ln[data-n="${P.scrollLine}"]`); if (ln) ss.scrollTop = ln.offsetTop - 80; P.scrollLine = null; }
  else if (P.scrollMem[scene.id] != null) ss.scrollTop = P.scrollMem[scene.id];
  ss.addEventListener('scroll', onScriptScroll, { passive: true });
  if (P.flashHl) { const id = P.flashHl; P.flashHl = null; $$('.m-' + id).forEach(x => x.classList.add('flash')); setTimeout(() => $$('.m-' + id).forEach(x => x.classList.remove('flash')), 1500); }
  setTimeout(computeViewport, 300);
}

async function gatherRun(r) {

  const names = ZCOLS.concat(['events']);
  const got = await Promise.all(names.map(get));
  const out = {}; names.forEach((n, i) => { out[n] = got[i]; });
  const wl = (await db.collection('wizardlog').where('runKey', '==', runKey(r)).get()).docs.map(d => ({ id: d.id, ...d.data() }));
  const runDoc = (await base.get()).data();
  const events = out.events.flatMap(b => b.events || []).sort((a, b) => a.t - b.t);

}

  if (MODE !== 'wizard') return;
  const t = e.target;
  if (t.dataset.pick) { if (t.checked) { if (Z.picked.size >= 4) { t.checked = false; toast('최대 4장까지 보낼 수 있습니다'); return; } Z.picked.add(t.dataset.pick); } else Z.picked.delete(t.dataset.pick); renderRight(); return; }
  if (t.id === 'pb') { Z.f.branch = t.value; renderRight(); }
  if (t.id === 'pp') { Z.f.polarity = t.value; renderRight(); }
  if (t.id === 'ps') { Z.f.src = t.value; renderRight(); }
});
let pqTimer = null;
document.addEventListener('input', e => { if (MODE === 'wizard' && e.target.id === 'pq') { Z.f.q = e.target.value; clearTimeout(pqTimer); pqTimer = setTimeout(renderRight, 300); } });
document.addEventListener('keydown', e => {
  if (MODE !== 'wizard' || !Z.selReq) return;
  if (typing()) return;
  if (/^[1-4]$/.test(e.key)) { const boxes = $$('#zRight [data-pick]'); const b = boxes[+e.key - 1]; if (b) { b.checked = !b.checked; b.dispatchEvent(new Event('change', { bubbles: true })); } }
  if (e.key === 'Enter' && Z.picked.size) { e.preventDefault(); zSend(); }
});
async function zSend() {
  const r = selRun(); const q = Z.selReq && Z.d.requests.get(Z.selReq); if (!r || !q || !Z.picked.size) return;
  const cards = [...Z.picked].map(id => Z.pool.get(id)).filter(Boolean).map(c => ({ cardId: c.id, type: c.type, branch: c.branch || '', polarity: c.polarity || '', title: c.title || '', play: c.play || '', character: c.character || '', sourceType: c.sourceType || '', summary: c.summary || '', quote: c.quote || '', sourceUrl: c.sourceUrl || '' }));
  const note = ($('#zNote') || {}).value || '';
  const btn = $('#zSend'); if (btn) btn.disabled = true;
  try {
    const base = runBase(r); const respId = rid();
    await base.collection('responses').doc(respId).set({ requestId: q.id, interpId: q.interpId || null, cards, sentAt: now(), origin: 'pool', waitMs: now() - q.createdAt });
    await base.collection('requests').doc(q.id).update({ status: 'answered', answeredAt: now(), responseId: respId });
    await db.collection('wizardlog').doc(rid()).set({ runKey: runKey(r), uid: r.uid, code: r.code, t: now(), kind: 'choice', label: '레퍼런스 응답', note, requestId: q.id, cardIds: cards.map(c => c.cardId), branch: Z.f.branch || '' });
    Z.picked.clear(); Z.selReq = null; Z.tl = null; toast(`${cards.length}장 보냈습니다`);
  } catch (e) { toast('보내지 못했습니다' + (e && e.code ? ` (${e.code})` : '')); }
  renderRight();
}

/* live counters */
setInterval(() => {
  $$('[data-since]').forEach(el => { el.textContent = fmtDur(now() - +el.dataset.since); });
  $$('[data-ago]').forEach(el => { el.textContent = ago(+el.dataset.ago || 0); });
  if (MODE === 'wizard' && Z.fresh.size && Z.tab === 'live') { let stale = false; for (const [k, t] of Z.fresh) if (now() - t > 4000) { Z.fresh.delete(k); stale = true; } if (stale) renderLive(); }
}, 1000);

boot();
})();
</script>
